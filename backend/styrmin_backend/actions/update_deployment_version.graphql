mutation UpdateDeploymentVersion(
    $deploymentId: UUID!
    $version: String!
    $startedByStepId: UUID
) {
    updateDeploymentVersion(
        deploymentId: $deploymentId
        version: $version
        startedByStepId: $startedByStepId
    ) {
        id
        status
        type
        deploymentId
    }
}
