fullnameOverride: "styrmin-traefik"
instanceLabelOverride: "styrmin-traefik"
image:
  tag: v3.0.1
ingressClass:
  enabled: false
  name: traefik
  isDefaultClass: false
globalArguments: "" # disable anonymous telemetry
additionalArguments:
  - "--providers.kubernetesingress.labelselector=styrmin/environment_id={{ labels.environment_id }}"
  # Trust X-Forwarded-* headers from any source on the public entrypoints so
  # Traefik's IPStrategy (depth=N) can resolve the client IP for IPAllowList
  # middlewares. Without this, the default behavior strips XFF and IPAllowList
  # with depth>=1 always returns the empty string → blanket 403. Operators
  # who want to restrict trust to specific upstream LBs/CDNs should replace
  # ``insecure=true`` with ``trustedIPs=<comma-list>``.
  - "--entryPoints.web.forwardedHeaders.insecure=true"
  - "--entryPoints.websecure.forwardedHeaders.insecure=true"
rbac:
  enabled: true
  namespaced: false
providers:
  kubernetesIngress:
    disableIngressClassLookup: true
deployment:
  replicas: 1
  podLabels:
    styrmin/role: ingress-controller
#hostNetwork: true
updateStrategy:
  rollingUpdate:
    maxUnavailable: 1
#securityContext:
#  allowPrivilegeEscalation: true
#   capabilities:
#     add:
#       - NET_BIND_SERVICE
#podSecurityContext:
#  runAsUser: 0
#  runAsGroup: 0
#  runAsNonRoot: false
service:
{% if instance.config.dedicated_ingress.service.annotations is mapping %}
  annotations:
{% for key, value in instance.config.dedicated_ingress.service.annotations.items() %}
    {{ key }}: "{{ value }}"
{% endfor %}
{% endif %}
  type: {{ instance.config.dedicated_ingress.service.type }}
{% if instance.config.dedicated_ingress.service.load_balancer_ip %}
  loadBalancerIP: "{{ instance.config.dedicated_ingress.service.load_balancer_ip }}"
{% endif %}
{% if instance.config.dedicated_ingress.service.external_traffic_policy %}
  externalTrafficPolicy: "{{ instance.config.dedicated_ingress.service.external_traffic_policy }}"
{% endif %}
{% if instance.config.dedicated_ingress.service.ip_families %}
  ipFamilies:
{% for family in instance.config.dedicated_ingress.service.ip_families %}
    - {{ family }}
{% endfor %}
{% endif %}
{% if instance.config.dedicated_ingress.service.ip_family_policy %}
  ipFamilyPolicy: {{ instance.config.dedicated_ingress.service.ip_family_policy }}
{% endif %}
{% if instance.config.dedicated_ingress.service.node_port %}
ports:
  websecure:
    nodePort: {{ instance.config.dedicated_ingress.service.node_port }}
{% endif %}
