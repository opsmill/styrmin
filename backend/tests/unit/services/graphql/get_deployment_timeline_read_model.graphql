query GetDeploymentTimelineReadModel($deploymentId: UUID!) {
    deploymentTimeline(deploymentId: $deploymentId) {
        applicationVersion
        contextDiff {
            changes {
                path
            }
        }
        task {
            id
            type
            status
            startedByStepId
            result
            startedBy {
                id
                type
                result
            }
            startedTasks {
                id
                type
                result
            }
            steps {
                id
                key
                name
                kind
                status
                startedAt
                endedAt
                durationSeconds
                attemptCount
                errors {
                    attempt
                    message
                    occurredAt
                }
                error
                detail
                rolledBackAt
                rollbackMessage
                hasOutput
                outputTruncated
                supersededBy {
                    id
                    type
                    result
                }
                startedTasks {
                    id
                    type
                    result
                }
                taskId
                backupId
                restoreId
            }
        }
    }
}
