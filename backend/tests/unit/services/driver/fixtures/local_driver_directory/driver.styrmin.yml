---
apiVersion: "styrmin.io/v1"
kind: ApplicationDriver
metadata:
  name: infrahub
spec:
  version: "0.1"
  supported_versions: ">=0.1,<1.0"
  info:
    icon: https://docs.infrahub.app/img/infrahub-logo.svg
    description: Next generation source of truth for infrastructure management
    authors: [fatih, jeremy]
    license: Apache-2.0
    links:
      - link: Homepage
        url: 'https://www.opsmill.com/'
      - link: Documentation
        url: 'https://docs.infrahub.app'
      - link: Github
        url: 'https://github.com/opsmill/infrahub'
  helm:
    main:
      location: oci://registry.opsmill.io/opsmill/chart/infrahub
      version: 2.3.*
  actions:
    - name: update_password
      description: Update administrator password
      location: "actions.py::update_password"
      hook: upgrade
      mode: post
      parameters:
        - name: password
          kind: string
          mandatory: true

    - name: setup
      description: Initial Setup of Infrahub
      location: "actions.py::setup"
      hook: setup
      mode: core
