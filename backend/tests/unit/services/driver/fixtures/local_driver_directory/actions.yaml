---
apiVersion: "styrmin.io/v1"
kind: ActionDefinition
metadata:
  package: infrahub
spec:
  actions:
    - name: update_password
      description: Update administrator password
      location: "actions.py::update_password"
      hook: upgrade
      mode: post
      parameters:
        - name: password
          kind: string
          mandatory: True

    - name: setup
      description: Initial Setup of Infrahub
      location: "actions.py::setup"
      hook: setup
      mode: core
