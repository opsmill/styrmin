query GetEnvironment(
    $environmentId: UUID,
    $environmentName: String,
    $clusterId: UUID,
    $clusterName: String
) {
    environment(
        environmentId: $environmentId,
        environmentName: $environmentName,
        clusterId: $clusterId,
        clusterName: $clusterName
    ) {
        id
        name
        cluster {
            id
            name
        }
    }
}
