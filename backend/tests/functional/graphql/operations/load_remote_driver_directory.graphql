mutation LoadRemoteDriverDirectory($repositoryUrl: String!, $branch: String!, $driverDirectory: String) {
    loadRemoteApplicationDriverVersion(
        repositoryUrl: $repositoryUrl
        branch: $branch
        driverDirectory: $driverDirectory
    ) {
        id
        applicationDriverId
        sourceType
        sourcePath
        driverDirectory
        sourceCommitSha
    }
}
