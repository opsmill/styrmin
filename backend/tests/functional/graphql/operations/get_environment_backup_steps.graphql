query GetEnvironmentBackupSteps($environmentBackupId: UUID!) {
    environmentBackup(environmentBackupId: $environmentBackupId) {
        id
        constituents {
            backup {
                id
                steps {
                    id
                    key
                }
            }
        }
        restores {
            id
            restores {
                id
                steps {
                    id
                    key
                }
            }
        }
    }
}
