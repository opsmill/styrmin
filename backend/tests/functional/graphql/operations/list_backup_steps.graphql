query ListBackupSteps($instanceId: UUID!) {
    backups(instanceId: $instanceId) {
        id
        steps {
            id
            key
            name
            kind
            status
            startedAt
            endedAt
            durationSeconds
            attemptCount
            errors {
                attempt
                message
                occurredAt
            }
            error
            detail
            rolledBackAt
            rollbackMessage
            hasOutput
            output
            outputTruncated
            supersededBy {
                id
            }
            startedTasks {
                id
            }
            noReportSince
            taskId
            backupId
            restoreId
        }
    }
}
