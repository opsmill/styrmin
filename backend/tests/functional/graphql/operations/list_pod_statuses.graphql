query ListPodStatuses(
    $deploymentId: UUID,
    $environmentId: UUID,
    $clusterId: UUID
) {
    podStatuses(
        deploymentId: $deploymentId,
        environmentId: $environmentId,
        clusterId: $clusterId
    ) {
        id
        podName
        namespace
        phase
        ready
        restartCount
        nodeName
        containerStatuses
    }
}
