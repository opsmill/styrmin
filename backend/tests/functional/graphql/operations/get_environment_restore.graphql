query GetEnvironmentRestore($environmentRestoreId: UUID!) {
    environmentRestore(environmentRestoreId: $environmentRestoreId) {
        id
        status
        environmentBackup {
            id
            name
        }
        restores {
            id
            status
            targetNamespace
        }
        skippedConstituents {
            deploymentId
            deploymentName
            reason
        }
    }
}
