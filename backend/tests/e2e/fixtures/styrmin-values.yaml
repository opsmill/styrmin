image:
  # The chart default registry points at registry.opsmill.io/opsmill which
  # is the published image — for the self-bootstrapping E2E vcluster we
  # need to use the locally-built `styrmin:latest` instead so the suite
  # exercises the current working tree, not whatever was last published.
  # See `backend/tests/e2e/conftest.py::styrmin_deployment` for the
  # `docker compose build` step that produces this tag.
  registry: ""
  repository: styrmin
  tag: latest
  pullPolicy: IfNotPresent

taskWorkerQuerySeconds: 1

styrmin:
  # Known credentials for the E2E suite — every test logs in as this user
  # and drives the SDK / Playwright session against the same row. ADR-017
  # forbids a STYRMIN_DISABLE_AUTH toggle, so the suite must traverse the
  # production auth path.
  adminUsername: "admin"
  adminPassword: "e2e-admin-password"
  agentPoll:
    retryDelaySeconds: 1
    interval: 1

styrmin-agent:
  # Same rationale as the top-level `image.registry` override above —
  # the agent subchart defaults to `registry.opsmill.io/opsmill/styrmin`
  # which the self-bootstrapping vcluster cannot resolve to the local
  # working-tree build. Point it at the locally-built `styrmin:latest`.
  image:
    repository: styrmin
  # The e2e suite runs multiple deployments and Prefect subprocesses inside
  # the agent pod. The default 1Gi limit OOMs under that load, which leaves
  # tasks stuck in RUNNING and blocks downstream status transitions.
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 512Mi
  prefect-worker:
    worker:
      config:
        queryInterval: 1
      extraEnvVarsCMs:
        - styrmin-config

postgresql:
  primary:
    livenessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 60
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 60

livenessProbe:
  initialDelaySeconds: 1
  periodSeconds: 1
  timeoutSeconds: 1
  failureThreshold: 60

readinessProbe:
  initialDelaySeconds: 1
  periodSeconds: 1
  timeoutSeconds: 1
  failureThreshold: 60

prefect-server:
  server:
    command:
      - /bin/sh
      - -c
      - |
        until python -c "import socket; s=socket.create_connection(('styrmin-postgresql', 5432), timeout=2); s.close()"; do
          echo "Waiting for PostgreSQL to be ready..."
          sleep 1
        done
        prefect server start --host 0.0.0.0

velero:
  enabled: true
  upgradeCRDs: false
  backupsEnabled: false
  credentials:
    useSecret: false
  image:
    pullPolicy: IfNotPresent

  livenessProbe:
    initialDelaySeconds: 1
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 60

  readinessProbe:
    initialDelaySeconds: 1
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 60
