image:
  # Local-dev default. `docker compose build` (run by the
  # styrmin_deployment fixture) tags the working-tree image as
  # `registry.opsmill.io/opsmill/styrmin:latest`; kubelet name-matches
  # the local image under `pullPolicy: IfNotPresent` and never contacts
  # the registry.
  #
  # CI overrides this via `--set image.tag=$STYRMIN_IMAGE_VER` so each
  # job on shared self-hosted runners builds and installs a tag scoped
  # to `local-<runner>-<sha>` (see `.github/workflows/ci.yml` and
  # `backend/tests/e2e/conftest.py::styrmin_deployment`).
  tag: latest

taskWorkerQuerySeconds: 1

styrmin:
  # Known credentials for the E2E suite — every test logs in as this user
  # and drives the SDK / Playwright session against the same row. ADR-017
  # forbids a STYRMIN_DISABLE_AUTH toggle, so the suite must traverse the
  # production auth path.
  adminUsername: "admin"
  adminPassword: "e2e-admin-password"
  agentPoll:
    retryDelaySeconds: 1
    interval: 1

styrmin-agent:
  image:
    # The agent subchart defaults `tag` to its own appVersion (the released
    # image), so pin it to `latest` to match the local `docker compose build`
    # output. CI overrides this via
    # `--set styrmin-agent.image.tag=$STYRMIN_IMAGE_VER` (see
    # `backend/tests/e2e/conftest.py::styrmin_deployment`).
    tag: latest

  # The e2e suite runs multiple deployments and Prefect subprocesses inside
  # the agent pod. The default 1Gi limit OOMs under that load, which leaves
  # tasks stuck in RUNNING and blocks downstream status transitions.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
  agent:
    extraEnv:
      # The kopf timer in `operator/handlers/styrmin_deployment.py` is the
      # ONLY path that advances a deployment past
      # `phase: CreatingHelmRelease` — phase 3 (Services -> Ready ->
      # `displayState: Running`) and the terminal `phase: Deleted` both
      # happen on a tick, never on a HelmRelease status event. With the
      # 60s production default (and `initial_delay` equal to it), every
      # create / upgrade / delete in the suite waited a full ~60s after
      # Kubernetes was already done: measured 10:23:45 "Phase 1 complete"
      # -> 10:24:45 "reached Ready state" while the Helm install itself
      # finished at 10:23:57. That dead wait, not the cluster, was the
      # bulk of E2E wall-clock.
      #
      # 5s keeps the drift-detection sweep in the `phase: Ready` branch
      # (a list+diff over NetworkPolicy/Secret/Service per CRD per tick)
      # to a sane rate while cutting ~55s off every lifecycle transition.
      - name: STYRMIN_OPERATOR_RECONCILE_INTERVAL
        value: "5"
      # The agent's embedded Prefect worker polls its work pool at Prefect's
      # 10s default; every create chains 3 agent flow runs (main, pre-hook,
      # post-hook), so each start waited ~9s on average.
      - name: PREFECT_WORKER_QUERY_SECONDS
        value: "1"

postgresql:
  primary:
    livenessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 60
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 60

livenessProbe:
  initialDelaySeconds: 1
  periodSeconds: 1
  timeoutSeconds: 1
  failureThreshold: 60

readinessProbe:
  initialDelaySeconds: 1
  periodSeconds: 1
  timeoutSeconds: 1
  failureThreshold: 60

prefect-server:
  server:
    command:
      - /bin/sh
      - -c
      - |
        until python -c "import socket; s=socket.create_connection(('styrmin-postgresql', 5432), timeout=2); s.close()"; do
          echo "Waiting for PostgreSQL to be ready..."
          sleep 1
        done
        prefect server start --host 0.0.0.0

velero:
  enabled: true
  upgradeCRDs: false
  backupsEnabled: false
  credentials:
    useSecret: false
  image:
    pullPolicy: IfNotPresent

  livenessProbe:
    initialDelaySeconds: 1
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 60

  readinessProbe:
    initialDelaySeconds: 1
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 60
