fullnameOverride: styrmin-simple-app

# The tag follows the application version, so a version change also changes the
# values: Flux then upgrades the release even when the new HelmChart is not ready
# yet on the first reconcile.
image:
  repository: simple-app
  tag: "{{ app.version }}"

ingress:
  enabled: true
  className: "{{ instance.config.ingress_class }}"
  hosts:
    - host: "{{ services['simple-app'].primary_fqdn }}"
      paths:
        - path: /
          pathType: Prefix

database:
  host: styrmin-postgresql

postgresql:
  enabled: true
  fullnameOverride: styrmin-postgresql
  auth:
    username: simple-app
    password: simple-app-password
    database: simple_app
  primary:
    livenessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 60
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 60
    terminationGracePeriodSeconds: 10
    persistence:
      enabled: true
      size: 1Gi
