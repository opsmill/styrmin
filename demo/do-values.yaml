---
# Helm values for the DigitalOcean demo deployment.
# Region: ams3 — update s3Url and region if deploying to a different region.

# --- Styrmin image ---
image:
  registry: registry.opsmill.io/opsmill
  tag: latest

# The agent subchart defaults to its own appVersion; pin it to the same
# floating tag the server uses so both roll together on the demo cluster.
styrmin-agent:
  image:
    tag: latest

# --- Ingress ---
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: traefik
  hosts:
    - host: demo.styrmin.app
      paths:
        - path: /
          pathType: Prefix
