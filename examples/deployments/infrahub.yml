---
apiVersion: styrmin/v1
kind: Deployment
metadata:
  name: infrahub-prod
spec:
  driver: infrahub          # required — not overridable
  version: 1.7.3            # must satisfy the driver's supported_versions (>=1.5,<2.0)
  # environment: production   # resolved by name
  # cluster: us-east        # only needed if the env name is ambiguous across clusters

  # Driver-declared parameters (see driver.styrmin.yml). Omitted ones use
  # the driver defaults: database_storage_size=100, enable_analytics=true.
  #
  # Earlier versions of this example set replicas_server: 1 and
  # replicas_task_worker: 1 under parameters. infrahub driver version 5 removes
  # both parameters, and replicas_task_worker: 1 is not the old default of 2,
  # so a deployment created from that example is rejected with
  # RETIRED_PARAMETER_VALUE when it moves to version 5. Before you apply this
  # manifest to such a deployment, follow
  # https://styrmin.pages.dev/docs/drivers/migrating-replica-parameters#deployments-created-from-the-earlier-example-manifest
  # parameters:
  #   database_storage_size: 200

  # Deployment configuration (maps to DeploymentConfig — snake_case keys).
  # Every field is optional; include only what you want to set.
  config:
    # ingress_class: traefik
    # fqdn_suffix: infrahub.example.com
    # ip_whitelist:
    #   - 10.0.0.0/8
    #   - 192.168.0.0/16
    # env_vars:
    #   - name: INFRAHUB_LOG_LEVEL
    #     value: INFO
    #   - name: INFRAHUB_PRODUCTION
    #     value: "true"
    #
    # Replica override: task-worker runs 1 pod instead of the driver default
    # of 2. database, task-manager-db and cache are singleton components and
    # do not accept a count above 1.
    components:
      - name: task-worker
        replicas: 1
