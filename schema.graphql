type Action {
  id: UUID!
  name: String!
  description: String!
  location: String!
  image: String
}

type ApplicationDriver {
  id: UUID!
  name: String!
  versions: [ApplicationDriverVersion!]!
}

type ApplicationDriverVersion {
  id: UUID!
  applicationDriverId: UUID!
  version: String!
  supportedVersions: String!
  defaultVersion: String
  sourceType: String!
  sourceRepository: String!
  sourceBranch: String
  sourcePath: String
  components: JSON
  services: [ServiceDefinition!]!
  parameters: [ParameterDefinition!]!
  componentConfigs: [ComponentConfig!]!
  helmChart: HelmChart!
  actions: [Action!]!
}

type ApplicationInstance {
  id: UUID!
  name: String!
  status: String!
  applicationVersion: String!
  applicationDriverVersionId: UUID!
  deploymentId: UUID!
}

type Backup {
  id: UUID!
  name: String!
  status: String!
  createdOn: DateTime!
  updatedOn: DateTime
  startedAt: DateTime
  completedAt: DateTime
  sizeBytes: Int
  errorMessage: String
  instanceId: UUID!
  componentStatuses: [ComponentBackupStatus!]
}

type BackupSchedule {
  id: UUID!
  name: String!
  enabled: Boolean!
  cronExpression: String!
  lastBackupAt: DateTime
  nextBackupAt: DateTime
  retentionCount: Int!
  prefectDeploymentId: UUID
  deploymentId: UUID!
  createdOn: DateTime!
  updatedOn: DateTime
}

type BackupStorageLocation {
  id: UUID!
  name: String!
  endpoint: String!
  bucket: String!
  region: String!
  createdOn: DateTime!
  updatedOn: DateTime
  environmentCount: Int!
}

type BackupStorageLocationAlreadyExists {
  message: String!
  existingId: UUID!
}

type BackupStorageLocationInUse {
  message: String!
  environmentNames: [String!]!
}

type BackupStorageLocationNotFound {
  message: String!
  backupStorageLocationId: UUID!
}

type CallbackResponse {
  message: String!
  success: Boolean!
}

type Cluster {
  id: UUID!
  name: String!
  config: JSON!
  createdOn: DateTime!
  updatedOn: DateTime
  environments: [Environment!]!
}

type Component {
  id: UUID!
  name: String!
  enabled: Boolean!
}

type ComponentBackupStatus {
  componentName: String!
  status: String!
  sizeBytes: Int
  errorMessage: String
}

type ComponentConfig {
  id: UUID!
  name: String!
  config: JSON
}

type ComponentRestoreStatus {
  componentName: String!
  status: String!
  errorMessage: String
}

union CreateBackupStorageLocationResult = BackupStorageLocation | BackupStorageLocationAlreadyExists

"""Date with time (isoformat)"""
scalar DateTime

union DeleteBackupStorageLocationResult = DeleteSuccess | BackupStorageLocationInUse

type DeleteSuccess {
  success: Boolean!
}

type DeployedService {
  id: UUID!
  driverServiceName: String!
  resolvedName: String!
  kind: String!
  scope: String!
  port: Int!
  component: String!
  deploymentId: UUID!
}

type Deployment {
  id: UUID!
  name: String!
  status: String!
  config: JSON!
  parameters: JSON!
  applicationVersion: String!
  applicationDriverVersionId: UUID!
  environmentId: UUID!
  internal: Boolean!
  applicationInstance: ApplicationInstance
  components: [Component!]!
  deployedServices: [DeployedService!]!
}

type Environment {
  id: UUID!
  name: String!
  config: JSON!
  cluster: Cluster!
  backupStorageLocation: BackupStorageLocation
  deployments: [Deployment!]!
}

type HelmChart {
  id: UUID!
  name: String!
  version: String!
  valueTemplate: String!
  repository: String!
}

"""The `JSON` scalar type represents JSON values as specified by ECMA-404"""
scalar JSON

type Mutation {
  createCluster(name: String!, config: JSON = null): Cluster
  deleteCluster(clusterId: UUID!): String
  createEnvironment(name: String!, clusterId: UUID!, config: JSON = null): Environment
  deleteEnvironment(environmentId: UUID!): String
  createBackupStorageLocation(name: String!, endpoint: String!, bucket: String!, region: String!, accessKeyId: String!, secretAccessKey: String!): CreateBackupStorageLocationResult!
  updateBackupStorageLocation(backupStorageLocationId: UUID!, name: String = null, endpoint: String = null, bucket: String = null, region: String = null, accessKeyId: String = null, secretAccessKey: String = null): UpdateBackupStorageLocationResult!
  deleteBackupStorageLocation(backupStorageLocationId: UUID!): DeleteBackupStorageLocationResult!
  assignBackupStorageLocation(environmentId: UUID!, backupStorageLocationId: UUID!): Environment
  unassignBackupStorageLocation(environmentId: UUID!): Environment
  loadLocalApplicationDriverVersion(path: String!): ApplicationDriverVersion
  loadRemoteApplicationDriverVersion(repositoryUrl: String!, branch: String!): ApplicationDriverVersion
  deploy(driver: String!, environmentId: UUID!, version: String = null, name: String = null, config: JSON = null, parameters: JSON = null, serviceNameOverrides: [ServiceNameOverride!] = null): Task
  updateDeployment(deploymentId: UUID!, name: String = null, config: JSON = null, parameters: JSON = null, serviceNameOverrides: [ServiceNameOverride!] = null): Task
  createBackup(instanceId: UUID!, name: String = null): Backup
  deleteBackup(backupId: UUID!): String
  createRestore(backupId: UUID!, targetNamespace: String!, targetInstanceId: UUID = null): Restore
  createBackupSchedule(deploymentId: UUID!, name: String!, cronExpression: String!, retentionCount: Int! = 10, enabled: Boolean! = true): BackupSchedule
  updateBackupSchedule(scheduleId: UUID!, name: String = null, cronExpression: String = null, retentionCount: Int = null, enabled: Boolean = null): BackupSchedule
  deleteBackupSchedule(scheduleId: UUID!): String
  callback(taskId: UUID!, stateName: String!, stateMessage: String, stateType: String!): CallbackResponse!
  stopComponents(deploymentId: UUID!, components: [String!]!): Task
  startComponents(deploymentId: UUID!, components: [String!]!): Task
  runJob(deploymentId: UUID!, commands: [String!]!, env: JSON!, image: String!): Task
  updateDeploymentVersion(deploymentId: UUID!, version: String!, parameters: JSON = null): Task
}

type ParameterDefinition {
  name: String!
  label: String!
  kind: String!
  default: JSON
  values: [String!]
}

type Query {
  clusters: [Cluster!]!
  cluster(clusterId: UUID!): Cluster
  backupStorageLocations: [BackupStorageLocation!]!
  backupStorageLocation(backupStorageLocationId: UUID!): BackupStorageLocation
  task(taskId: UUID!): Task
  tasks: [Task!]!
  environments: [Environment!]!
  environment(environmentId: UUID!): Environment
  deployment(deploymentId: UUID!): Deployment
  backup(backupId: UUID!): Backup
  backups(instanceId: UUID!, status: String = null): [Backup!]!
  restore(restoreId: UUID!): Restore
  restores(backupId: UUID!, status: String = null): [Restore!]!
  backupSchedule(scheduleId: UUID!): BackupSchedule
  backupSchedules(deploymentId: UUID!): [BackupSchedule!]!
  applicationDrivers: [ApplicationDriver!]!
  applicationDriver(applicationDriverId: UUID!): ApplicationDriver
  environmentServices(environmentId: UUID!): [DeployedService!]!
  deploymentServices(deploymentId: UUID!): [DeployedService!]!

  """Health check probe"""
  ok: Boolean!
}

type Restore {
  id: UUID!
  name: String!
  status: String!
  createdOn: DateTime!
  updatedOn: DateTime
  startedAt: DateTime
  completedAt: DateTime
  targetNamespace: String!
  errorMessage: String
  backupId: UUID!
  targetInstanceId: UUID
  componentStatuses: [ComponentRestoreStatus!]
}

type ServiceDefinition {
  name: String!
  kind: String!
  scope: String!
  port: Int!
  component: String!
}

input ServiceNameOverride {
  driverServiceName: String!
  overrideName: String!
}

type Task {
  id: UUID!
  type: String!
  status: String!
  message: String
  deploymentId: UUID
}

scalar UUID

union UpdateBackupStorageLocationResult = BackupStorageLocation | BackupStorageLocationNotFound