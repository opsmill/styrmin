"""
Per-component override block for a deployment: env vars, the container ``command``/``args``, the component container's ``image``, and the component's ``replicas`` count.
"""
input ComponentConfigInput {
  """
  The component name as declared by the application-driver version the deployment is bound to after the write: the pinned one on updateDeployment, the target one on updateDeploymentVersion. Must match a known component: an unknown one raises the error of the override it carries, such as ``UNKNOWN_COMPONENT_ENV_VAR`` or ``UNKNOWN_COMPONENT_REPLICA_OVERRIDE``. Overrides on a component that declares no component container raise ``COMPONENT_CONTAINER_NOT_DECLARED`` (see ``envVars``).
  """
  name: String!

  """
  Environment-variable overrides scoped to this component. Submitted as a list of ``{name, value}`` rows; duplicates within the list raise ``DUPLICATE_ENV_VAR_NAME`` with the component scope in the payload. Adding or changing a value on a component that declares no component container raises ``COMPONENT_CONTAINER_NOT_DECLARED``; removing values or re-submitting the stored ones unchanged is accepted.
  """
  envVars: [EnvVarInput!] = null

  """
  Container entrypoint override for this component, scoped to this deployment, applied to the component container the driver declares. A non-empty list of strings; an empty list raises ``INVALID_CONTAINER_COMMAND``. Under full-replacement semantics ``null``/omitting it CLEARS the override (the chart/image default flows through) — clearing is never an empty list. Passed through verbatim — no templating. Adding or changing it on a component that declares no component container raises ``COMPONENT_CONTAINER_NOT_DECLARED``; removing it or re-submitting the stored list unchanged is accepted.
  """
  command: [String!] = null

  """
  Container args override for this component. Same shape and rules as ``command``, raising ``INVALID_CONTAINER_ARGS`` or ``COMPONENT_CONTAINER_NOT_DECLARED``.
  """
  args: [String!] = null

  """
  Image reference for this component's component container, scoped to this deployment. A full reference with an explicit tag or digest; every ``{{ app.version }}`` token is replaced with the deployment's application version at render time, and a literal tag pins the image. Under full-replacement semantics ``null``/omitting it CLEARS the override (the chart image applies). Raises ``UNKNOWN_COMPONENT_IMAGE_OVERRIDE``, ``INVALID_IMAGE_REFERENCE``, or ``COMPONENT_CONTAINER_NOT_DECLARED`` (adding or changing it on a component without a component container; removing it is always accepted).
  """
  image: String = null

  """
  Replica count for this component, scoped to this deployment: an integer of 1 or more, applied to `spec.replicas` of every Deployment and StatefulSet that matches the component's label selector. Needs no component container. Under full-replacement semantics `null`/omitting it CLEARS the override, and the component returns to the driver default or to the chart's count. A value below 1 raises `INVALID_REPLICA_COUNT` (stop the component instead); a value above 1 on a singleton component raises `SINGLETON_REPLICA_OVERRIDE`; adding or changing it on a component the driver version does not declare raises `UNKNOWN_COMPONENT_REPLICA_OVERRIDE`; adding or changing it to a value above the server setting `STYRMIN_MAX_REPLICA_COUNT` raises `REPLICA_COUNT_ABOVE_MAXIMUM`.
  """
  replicas: Int = null
}

"""
The container ``command``/``args`` override targeting one component of a deployment. Applicable overrides are applied by a post-render patch to the component container the driver declares. ``isOrphaned`` flags blocks whose component the deployment's current driver no longer declares; ``isApplicable`` flags whether the override can reach a container. Non-applicable blocks remain visible in the API but are NOT applied to rendered pods. ``command``/``args`` are ``null`` when no override is set for that slot (the chart's own value applies).
"""
type ComponentContainerOverrides {
  """Name of the targeted component."""
  component: String!

  """
  Resolved entrypoint override for this component, or ``null`` when unset (the chart/image default applies).
  """
  command: [String!]

  """
  Resolved args override for this component, or ``null`` when unset (the chart/image default applies).
  """
  args: [String!]

  """
  True when the deployment's current driver no longer declares this component (the upgrade renamed or removed it). Orphaned blocks are visible in the API but are NOT applied to rendered pods, so the operator can audit and clean them up.
  """
  isOrphaned: Boolean!

  """
  False when the override cannot reach a container: the component is orphaned (`isOrphaned`) or the driver declares no component container for it. The stored values are kept but not applied.
  """
  isApplicable: Boolean!
}

"""
A bundle of environment variables targeting one component of a deployment. Applicable env vars are injected by a post-render patch into the component container the driver declares. ``isOrphaned`` flags blocks whose component the deployment's current driver no longer declares; ``isApplicable`` flags whether the env vars can reach any container. Non-applicable blocks remain visible in the API but are NOT injected into rendered pods.
"""
type ComponentEnvVars {
  """Name of the targeted component."""
  component: String!

  """
  The effective env vars set on this component (env+dep+component merged).
  """
  envVars: [EnvVar!]!

  """
  True when the deployment's current driver no longer declares this component (the upgrade renamed or removed it). Orphaned blocks are visible in the API but are NOT injected into rendered pods, so the user can audit and clean them up.
  """
  isOrphaned: Boolean!

  """
  False when these env vars cannot reach any container: the component is orphaned (`isOrphaned`) or the driver declares no component container for it. Stored values are kept but not injected.
  """
  isApplicable: Boolean!
}

"""
The image override for one component's component container. Orphaned or non-applicable overrides stay visible but are not rendered.
"""
type ComponentImageOverride {
  """Name of the targeted component."""
  component: String!

  """The stored image reference, `{{ app.version }}` tokens included."""
  reference: String!

  """
  `reference` with every `{{ app.version }}` token replaced by the deployment's `applicationVersion`.
  """
  resolvedReference: String!

  """
  True when the deployment's current driver no longer declares this component (the upgrade renamed or removed it).
  """
  isOrphaned: Boolean!

  """
  False when the override cannot reach a container: the component is orphaned (`isOrphaned`) or the driver declares no component container for it. The stored reference is kept but not rendered.
  """
  isApplicable: Boolean!
}

"""
The replica count of one component of a deployment and where it comes from. One row per component the bound driver version declares, plus one per orphaned replica override.
"""
type ComponentReplicas {
  """Name of the component."""
  component: String!

  """
  The count Styrmin applies while the component runs. Null when the source is CHART or the row is orphaned. A stopped component runs 0 pods whatever this is; see Deployment.components[].enabled.
