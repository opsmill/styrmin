type Action {
  id: UUID!
  name: String!
  description: String!
  location: String!
  image: String
}

type ApplicationDriver {
  id: UUID!
  name: String!
  versions: [ApplicationDriverVersion!]!
}

type ApplicationDriverVersion {
  id: UUID!
  applicationDriverId: UUID!
  version: String!
  supportedVersions: String!
  defaultVersion: String
  sourceType: String!
  sourceRepository: String!
  sourceBranch: String
  sourcePath: String
  components: JSON
  applicationDriver: ApplicationDriver!
  services: [ServiceDefinition!]!
  parameters: [ParameterDefinition!]!
  componentConfigs: [ComponentConfig!]!
  helmChart: HelmChart!
  actions: [Action!]!
}

type ApplicationInstance {
  id: UUID!
  name: String!
  status: String!
  applicationVersion: String!
  applicationDriverVersionId: UUID!
  deploymentId: UUID!
  applicationDriverVersion: ApplicationDriverVersion!
}

type Backup {
  id: UUID!
  name: String!
  status: String!
  createdOn: DateTime!
  updatedOn: DateTime
  startedAt: DateTime
  completedAt: DateTime
  sizeBytes: Int
  errorMessage: String
  instanceId: UUID!
  instance: ApplicationInstance!
  componentStatuses: [ComponentBackupStatus!]
}

type BackupSchedule {
  id: UUID!
  name: String!
  enabled: Boolean!
  cronExpression: String!
  lastBackupAt: DateTime
  nextBackupAt: DateTime
  retentionCount: Int!
  prefectDeploymentId: UUID
  deploymentId: UUID!
  createdOn: DateTime!
  updatedOn: DateTime
  deployment: Deployment!
}

type BackupStorageLocation {
  id: UUID!
  name: String!
  endpoint: String!
  bucket: String!
  region: String!
  createdOn: DateTime!
  updatedOn: DateTime
  environmentCount: Int!
}

type CallbackResponse {
  message: String!
  success: Boolean!
}

type Cluster {
  id: UUID!
  name: String!
  config: JSON!
  capabilities: JSON!
  createdOn: DateTime!
  updatedOn: DateTime
  environments: [Environment!]!
}

type Component {
  id: UUID!
  name: String!
  enabled: Boolean!
}

type ComponentBackupStatus {
  componentName: String!
  status: String!
  sizeBytes: Int
  errorMessage: String
}

type ComponentConfig {
  id: UUID!
  name: String!
  config: JSON
}

type ComponentRestoreStatus {
  componentName: String!
  status: String!
  errorMessage: String
}

type ContextChange {
  path: String!
  action: String!
  oldValue: JSON
  newValue: JSON
}

type ContextDiff {
  changes: [ContextChange!]!
}

input CrdConditionInput {
  type: String!
  status: String!
  reason: String = null
  message: String = null
  lastTransitionTime: DateTime = null
}

type CrdConditionType {
  type: String!
  status: String!
  reason: String
  message: String
  lastTransitionTime: DateTime
}

"""Date with time (isoformat)"""
scalar DateTime

type DeployedService {
  id: UUID!
  driverServiceName: String!
  resolvedName: String!
  kind: String!
  scope: String!
  port: Int!
  component: String!
  primaryFqdn: String
  humanReadableFqdn: String
  deploymentId: UUID!
}

type Deployment {
  id: UUID!
  name: String!
  status: String!
  config: JSON!
  parameters: JSON!
  applicationVersion: String!
  applicationDriverVersionId: UUID!
  environmentId: UUID!
  internal: Boolean!
  applicationInstance: ApplicationInstance
  components: [Component!]!
  environment: Environment!
  applicationDriverVersion: ApplicationDriverVersion!
  deployedServices: [DeployedService!]!
  podStatuses: [PodStatus!]!
  crdStatus: DeploymentCrdStatusType
}

input DeploymentCrdStatusReportInput {
  deploymentId: UUID!
  phase: String!
  displayState: String = null
  message: String = null
  conditions: [CrdConditionInput!] = null
  managedResourceCounts: ManagedResourceCountsInput = null
}

type DeploymentCrdStatusType {
  id: UUID!
  deploymentId: UUID!
  phase: String!
  message: String
  conditions: [CrdConditionType!]!
  managedResourceCounts: ManagedResourceCountsType
  lastPolledAt: DateTime
  createdOn: DateTime
  updatedOn: DateTime
}

input DeploymentPodStatusReport {
  deploymentId: UUID!
  pods: [PodStatusInput!]!
}

type DeploymentTimelineEntry {
  task: Task!
  applicationVersion: String
  contextDiff: ContextDiff
}

type Environment {
  id: UUID!
  name: String!
  config: JSON!
  capabilities: JSON!
  cluster: Cluster!
  backupStorageLocation: BackupStorageLocation
  deployments: [Deployment!]!
}

type HelmChart {
  id: UUID!
  name: String!
  version: String!
  valueTemplate: String!
  repository: String!
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf).
"""
scalar JSON @specifiedBy(url: "https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf")

input ManagedResourceCountsInput {
  networkPolicies: Int! = 0
  secrets: Int! = 0
  helmReleases: Int! = 0
  services: Int! = 0
  middlewares: Int! = 0
}

type ManagedResourceCountsType {
  networkPolicies: Int!
  secrets: Int!
  helmReleases: Int!
  services: Int!
  middlewares: Int!
}

type Mutation {
  createCluster(name: String! = "default", config: JSON = null): Cluster
  deleteCluster(clusterId: UUID = null, clusterName: String = null): String
  createEnvironment(name: String!, clusterId: UUID = null, clusterName: String = null, config: JSON = null): Environment
  deleteEnvironment(environmentId: UUID = null, environmentName: String = null, clusterId: UUID = null, clusterName: String = null): String
  createBackupStorageLocation(name: String!, endpoint: String!, bucket: String!, region: String!, accessKeyId: String!, secretAccessKey: String!): BackupStorageLocation
  updateBackupStorageLocation(backupStorageLocationId: UUID!, name: String = null, endpoint: String = null, bucket: String = null, region: String = null, accessKeyId: String = null, secretAccessKey: String = null): BackupStorageLocation
  deleteBackupStorageLocation(backupStorageLocationId: UUID!): String
  assignBackupStorageLocation(environmentId: UUID!, backupStorageLocationId: UUID!): Environment
  unassignBackupStorageLocation(environmentId: UUID!): Environment
  loadLocalApplicationDriverVersion(path: String!): ApplicationDriverVersion
  loadRemoteApplicationDriverVersion(repositoryUrl: String!, branch: String!): ApplicationDriverVersion
  deploy(driver: String!, environmentId: UUID = null, environmentName: String = null, clusterId: UUID = null, clusterName: String = null, version: String = null, name: String = null, config: JSON = null, parameters: JSON = null, serviceNameOverrides: [ServiceNameOverride!] = null): Task
  updateDeployment(deploymentId: UUID!, name: String = null, config: JSON = null, parameters: JSON = null, serviceNameOverrides: [ServiceNameOverride!] = null): Task
  createBackup(instanceId: UUID!, name: String = null): Backup
  deleteBackup(backupId: UUID!): String
  createRestore(backupId: UUID!, targetNamespace: String!, targetInstanceId: UUID = null): Restore
  createBackupSchedule(deploymentId: UUID!, name: String!, cronExpression: String!, retentionCount: Int! = 10, enabled: Boolean! = true): BackupSchedule
  updateBackupSchedule(scheduleId: UUID!, name: String = null, cronExpression: String = null, retentionCount: Int = null, enabled: Boolean = null): BackupSchedule
  deleteBackupSchedule(scheduleId: UUID!): String
  callback(taskId: UUID!, stateName: String!, stateMessage: String, stateType: String!): CallbackResponse!
  stopComponents(deploymentId: UUID!, components: [String!]!): Task
  startComponents(deploymentId: UUID!, components: [String!]!): Task
  runJob(deploymentId: UUID!, commands: [String!]!, env: [JSON!]!, image: String!): Task
  updateDeploymentVersion(deploymentId: UUID!, version: String!, parameters: JSON = null): Task
  reportPodStatuses(reports: [DeploymentPodStatusReport!]!): ReportPodStatusesResponse!
  reportCrdStatuses(reports: [DeploymentCrdStatusReportInput!]!): ReportCrdStatusesResponse!
}

type ParameterDefinition {
  name: String!
  label: String!
  kind: String!
  default: JSON
  values: [String!]
}

enum PodPhase {
  PENDING
  RUNNING
  SUCCEEDED
  FAILED
  UNKNOWN
}

type PodStatus {
  id: UUID!
  deploymentId: UUID!
  podName: String!
  namespace: String!
  phase: PodPhase!
  ready: Boolean!
  restartCount: Int!
  containerStatuses: JSON!
  nodeName: String
  startedAt: DateTime
  lastPolledAt: DateTime
  createdOn: DateTime
  updatedOn: DateTime
}

input PodStatusInput {
  podName: String!
  namespace: String!
  phase: PodPhase!
  ready: Boolean!
  restartCount: Int!
  containerStatuses: JSON = null
  nodeName: String = null
  startedAt: DateTime = null
}

type Query {
  clusters: [Cluster!]!
  cluster(clusterId: UUID = null, clusterName: String = null): Cluster
  backupStorageLocations: [BackupStorageLocation!]!
  backupStorageLocation(backupStorageLocationId: UUID!): BackupStorageLocation
  task(taskId: UUID!): Task
  tasks: [Task!]!
  environments: [Environment!]!
  environment(environmentId: UUID = null, environmentName: String = null, clusterId: UUID = null, clusterName: String = null): Environment
  deployment(deploymentId: UUID!): Deployment
  backup(backupId: UUID!): Backup
  backups(instanceId: UUID!, status: String = null): [Backup!]!
  restore(restoreId: UUID!): Restore
  restores(backupId: UUID!, status: String = null): [Restore!]!
  backupSchedule(scheduleId: UUID!): BackupSchedule
  backupSchedules(deploymentId: UUID!): [BackupSchedule!]!
  applicationDrivers: [ApplicationDriver!]!
  applicationDriver(applicationDriverId: UUID!): ApplicationDriver
  environmentServices(environmentId: UUID!): [DeployedService!]!
  deploymentServices(deploymentId: UUID!): [DeployedService!]!
  deploymentTimeline(deploymentId: UUID!): [DeploymentTimelineEntry!]!
  podStatuses(deploymentId: UUID = null, environmentId: UUID = null, clusterId: UUID = null): [PodStatus!]!

  """Health check probe"""
  ok: Boolean!
}

type ReportCrdStatusesResponse {
  success: Boolean!
  message: String!
  statusesUpdated: Int!
  deploymentsUpdated: Int!
}

type ReportPodStatusesResponse {
  success: Boolean!
  message: String!
  podsUpdated: Int!
  podsRemoved: Int!
}

