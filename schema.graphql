  startedAt: DateTime
  completedAt: DateTime
  targetNamespace: String!
  errorMessage: String
  backupId: UUID!
  targetInstanceId: UUID
  backup: Backup!
  componentStatuses: [ComponentRestoreStatus!]
}

type ServiceDefinition {
  name: String!
  kind: String!
  scope: String!
  port: Int!
  component: String!
}

input ServiceNameOverride {
  driverServiceName: String!
  overrideName: String!
}

type Task {
  id: UUID!
  type: String!
  status: String!
  message: String
