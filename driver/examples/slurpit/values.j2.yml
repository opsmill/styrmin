---
fullnameOverride: styrmin-slurpit

global:
  timezone: "{{ parameters.timezone }}"
  image:
    version: "{{ app.version }}"
    pullPolicy: IfNotPresent

# --- MariaDB ---
mariadb:
  enabled: true
  image:
    name: mariadb
    version: "12-noble"
  service:
    type: ClusterIP
  storage:
    enabled: true
    accessModes: ReadWriteOnce
    size: "{{ parameters.mariadb_storage_size }}Gi"
    className: "{{ instance.config.standard_storage.storage_class }}"
  # Hardcoded mariadb creds plus operator-supplied env vars for the
  # `mariadb` component.
  env:
    - name: MARIADB_DATABASE
      value: portal
    - name: MARIADB_USER
      value: slurpit
    - name: MARIADB_PASSWORD
      value: slurpit-styrmin-password
    - name: MARIADB_ROOT_PASSWORD
      value: slurpit-styrmin-root-password
{%- for entry in components | component_env_vars("mariadb") %}
    - name: {{ entry.name | tojson }}
      value: {{ entry.value | tojson }}
{%- endfor %}
  extraVolumes:
    - name: backup
      emptyDir: {}
  extraVolumeMounts:
    - name: backup
      mountPath: /backup

# --- MongoDB ---
mongodb:
  enabled: true
  image:
    name: mongo
    version: "8"
  service:
    type: ClusterIP
  storage:
    enabled: true
    accessModes: ReadWriteOnce
    size: "{{ parameters.mongodb_storage_size }}Gi"
    className: "{{ instance.config.standard_storage.storage_class }}"
  # Hardcoded mongo creds plus operator-supplied env vars for the
  # `mongodb` component.
  env:
    - name: MONGO_INITDB_ROOT_USERNAME
      value: slurpit
    - name: MONGO_INITDB_ROOT_PASSWORD
      value: slurpit-styrmin-mongo-password
{%- for entry in components | component_env_vars("mongodb") %}
    - name: {{ entry.name | tojson }}
      value: {{ entry.value | tojson }}
{%- endfor %}
  extraVolumes:
    - name: backup
      emptyDir: {}
  extraVolumeMounts:
    - name: backup
      mountPath: /backup

# --- Portal ---
portal:
  enabled: true
  image:
    name: slurpit/portal
    version: latest
  service:
    type: ClusterIP
  storage:
    enabled: true
    accessModes: ReadWriteOnce
    size: "{{ parameters.portal_storage_size }}Gi"
    className: "{{ instance.config.standard_storage.storage_class }}"
  # Hardcoded portal wiring plus operator-supplied env vars for the
  # `portal` component.
  env:
    - name: PORTAL_DB_HOSTNAME
      value: styrmin-slurpit-mariadb-service
    - name: PORTAL_DB_PORT
      value: "3306"
    - name: PORTAL_DB_NAME
      value: portal
    - name: PORTAL_DB_USERNAME
      value: slurpit
    - name: PORTAL_DB_PASSWORD
      value: slurpit-styrmin-password
    - name: PORTAL_WAREHOUSE_URL
      value: "http://styrmin-slurpit-warehouse-service"
    - name: PORTAL_WAREHOUSE_TOKEN
      value: styrmin-slurpit-pw-token
    - name: PORTAL_WAREHOUSE_CALLBACK_TOKEN
      value: styrmin-slurpit-pwcb-token
    - name: PORTAL_SAFEKEY
      value: styrmin-slurpit-safekey
    - name: PORTAL_BASE_URL
      value: "http://{{ services.slurpit.primary_fqdn }}"
{%- for entry in components | component_env_vars("portal") %}
    - name: {{ entry.name | tojson }}
      value: {{ entry.value | tojson }}
{%- endfor %}

ingress:
  enabled: true
  className: "{{ instance.config.ingress_class }}"
  hosts:
    - host: "{{ services.slurpit.primary_fqdn }}"
      paths:
        - path: /
          pathType: Prefix

# --- Warehouse ---
warehouse:
  enabled: true
  image:
    name: slurpit/warehouse
  service:
    type: ClusterIP
  storage:
    enabled: true
    accessModes: ReadWriteOnce
    size: "{{ parameters.warehouse_storage_size }}Gi"
    className: "{{ instance.config.standard_storage.storage_class }}"
  # Hardcoded warehouse wiring plus operator-supplied env vars for the
  # `warehouse` component.
  env:
    - name: WAREHOUSE_MONGODB_URI
      value: "mongodb://slurpit:slurpit-styrmin-mongo-password@styrmin-slurpit-mongodb-service:27017/slurpit?authSource=admin"
    - name: WAREHOUSE_PORTAL_URL
      value: "http://styrmin-slurpit-portal-service"
    - name: WAREHOUSE_PORTAL_TOKEN
      value: styrmin-slurpit-pwcb-token
    - name: WAREHOUSE_API_TOKEN
      value: styrmin-slurpit-pw-token
{%- for entry in components | component_env_vars("warehouse") %}
    - name: {{ entry.name | tojson }}
      value: {{ entry.value | tojson }}
{%- endfor %}

# --- Scanner ---
scanner:
  enabled: true
  image:
    name: slurpit/scanner
  # Hardcoded scanner wiring plus operator-supplied env vars for the
  # `scanner` component.
  env:
    - name: SCANNER_WAREHOUSE_HOSTNAME
      value: styrmin-slurpit-warehouse-service
    - name: SCANNER_WAREHOUSE_PORT
      value: "50051"
    - name: SCANNER_WAREHOUSE_TOKEN
      value: styrmin-slurpit-pw-token
    - name: SCANNER_POOLSIZE
      value: "{{ parameters.scanner_pool_size }}"
{%- for entry in components | component_env_vars("scanner") %}
    - name: {{ entry.name | tojson }}
      value: {{ entry.value | tojson }}
{%- endfor %}

# --- Scraper ---
scraper:
  enabled: true
  image:
    name: slurpit/scraper
  # Hardcoded scraper wiring plus operator-supplied env vars for the
  # `scraper` component.
  env:
    - name: SCRAPER_WAREHOUSE_HOSTNAME
      value: styrmin-slurpit-warehouse-service
    - name: SCRAPER_WAREHOUSE_PORT
      value: "50051"
    - name: SCRAPER_WAREHOUSE_TOKEN
      value: styrmin-slurpit-pw-token
    - name: SCRAPER_POOLSIZE
      value: "{{ parameters.scraper_pool_size }}"
{%- for entry in components | component_env_vars("scraper") %}
    - name: {{ entry.name | tojson }}
      value: {{ entry.value | tojson }}
{%- endfor %}
