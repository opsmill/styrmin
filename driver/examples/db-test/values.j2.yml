fullnameOverride: styrmin-db-test

image:
  repository: db-test
  tag: "{{ app.version }}"

# Operator-supplied env vars for the `server` component
# (`components.server.env_vars.config`, env→dep→comp deepest-wins).
extraEnv: {{ components | component_env_vars("server") | tojson }}

mariadb:
  fullnameOverride: styrmin-db-test-mariadb
  auth:
    database: testdb
    username: testuser
    password: test-password
    rootPassword: root-password
  primary:
    livenessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 60
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 60
    persistence:
      size: 1Gi
      storageClass: "{{ instance.config.standard_storage.storage_class }}"
    extraVolumes:
      - name: backup
        emptyDir: {}
    extraVolumeMounts:
      - name: backup
        mountPath: /backup
    # Hardcoded MARIADB_PASSWORD plus operator-supplied env vars for the
    # `mariadb` component.
    extraEnvVars:
      - name: MARIADB_PASSWORD
        value: test-password
{%- for entry in components | component_env_vars("mariadb") %}
      - name: {{ entry.name | tojson }}
        value: {{ entry.value | tojson }}
{%- endfor %}

mongodb:
  fullnameOverride: styrmin-db-test-mongodb
  architecture: standalone
  livenessProbe:
    initialDelaySeconds: 1
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 60
  readinessProbe:
    initialDelaySeconds: 1
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 60
  auth:
    enabled: true
    rootUser: testuser
    rootPassword: test-mongo-password
  persistence:
    size: 1Gi
    storageClass: "{{ instance.config.standard_storage.storage_class }}"
  extraVolumes:
    - name: backup
      emptyDir: {}
  extraVolumeMounts:
    - name: backup
      mountPath: /backup
  # Hardcoded mongo root creds plus operator-supplied env vars for the
  # `mongodb` component.
  extraEnvVars:
    - name: MONGO_INITDB_ROOT_USERNAME
      value: testuser
    - name: MONGO_INITDB_ROOT_PASSWORD
      value: test-mongo-password
{%- for entry in components | component_env_vars("mongodb") %}
    - name: {{ entry.name | tojson }}
      value: {{ entry.value | tojson }}
{%- endfor %}
