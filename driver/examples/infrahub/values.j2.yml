---
fullnameOverride: styrmin-infrahub
global:
  infrahubTag: "{{ app.version }}"
infrahubDemoData:
  enabled: false
infrahubServer:
  ingress:
    enabled: true
    hostname: "{{ services.infrahub.primary_fqdn }}"
    extraHosts:
      - name: "{{ services.infrahub.human_readable_fqdn }}"
        path: /
  infrahubServer:
    # Hardcoded chart wiring + operator-supplied env vars for the `server`
    # component.
    env:
      - name: PREFECT_API_URL
        value: "http://styrmin-task-manager:4200/api"
      - name: INFRAHUB_WORKFLOW_ADDRESS
        value: styrmin-task-manager
{%- for entry in components | component_env_vars("server") %}
      - name: {{ entry.name | tojson }}
        value: {{ entry.value | tojson }}
{%- endfor %}
  persistence:
    accessMode: ReadWriteOnce
    enabled: true
    storageClassName: "{{ instance.config.standard_storage.storage_class }}"
  replicas: "{{ parameters.replicas_server }}"
infrahubTaskWorker:
  infrahubTaskWorker:
    # Hardcoded chart wiring + operator-supplied env vars for the
    # `task-worker` component.
    env:
      - name: PREFECT_API_URL
        value: "http://styrmin-task-manager:4200/api"
      - name: INFRAHUB_WORKFLOW_ADDRESS
        value: styrmin-task-manager
{%- for entry in components | component_env_vars("task-worker") %}
      - name: {{ entry.name | tojson }}
        value: {{ entry.value | tojson }}
{%- endfor %}
  replicas: "{{ parameters.replicas_task_worker }}"
nats:
  enabled: false
neo4j:
  additionalVolumeMounts:
    - mountPath: /backup
      name: backup
  additionalVolumes:
    - emptyDir: {}
      name: backup
  # Operator-supplied env vars for the `database` component.
  env: {{ components | component_env_vars("database") | tojson }}
  config:
    server.backup.enabled: "true"
  disableLookups: true
  fullnameOverride: styrmin-database
  services:
    admin:
      enabled: true
  volumes:
    data:
      dynamic:
        requests:
          storage: "{{ parameters.database_storage_size }}Gi"
        storageClassName: "{{ instance.config.standard_storage.storage_class }}"
      mode: dynamic
nfs-server-provisioner:
  enabled: false
prefect-server:
  enabled: true
  fullnameOverride: styrmin-task-manager
  postgresql:
    architecture: standalone
    auth:
      database: prefect
      password: prefect-opsmill
      username: prefect
    enabled: true
    fullnameOverride: styrmin-postgresql
    image:
      tag: 14.13.0
    primary:
      persistence:
        enabled: true
        storageClass: "{{ instance.config.standard_storage.storage_class }}"
      extraVolumes:
        - name: backup
          emptyDir: {}
      extraVolumeMounts:
        - name: backup
          mountPath: /backup
      startupProbe:
        enabled: true
        initialDelaySeconds: 1
        periodSeconds: 1
        timeoutSeconds: 1
        failureThreshold: 120
      readinessProbe:
        initialDelaySeconds: 1
        periodSeconds: 1
        timeoutSeconds: 1
        failureThreshold: 120
      resourcesPreset: none
    # Hardcoded analytics flag plus operator-supplied env vars for the
    # `task-manager-db` component.
    env:
      - name: PREFECT_SERVER_ANALYTICS_ENABLED
        value: "{{ parameters.enable_analytics }}"
{%- for entry in components | component_env_vars("task-manager-db") %}
      - name: {{ entry.name | tojson }}
        value: {{ entry.value | tojson }}
{%- endfor %}
rabbitmq:
  enabled: true
  fullnameOverride: styrmin-message-queue
  auth:
    erlangCookie: styrmin-infrahub-supersecret
  # Operator-supplied env vars for the `message-queue` component.
  extraEnvVars: {{ components | component_env_vars("message-queue") | tojson }}
  startupProbe:
    enabled: true
    initialDelaySeconds: 1
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 120
  readinessProbe:
    initialDelaySeconds: 1
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 120
  resourcesPreset: none
redis:
  enabled: true
  fullnameOverride: styrmin-cache
  master:
    # Operator-supplied env vars for the `cache` component.
    extraEnvVars: {{ components | component_env_vars("cache") | tojson }}
    startupProbe:
      enabled: true
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 120
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 120
    resourcesPreset: none
