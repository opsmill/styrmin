---
apiVersion: "styrmin.io/v1"
kind: ApplicationDriver
metadata:
  name: infrahub
spec:
  version: "3"
  supported_versions: ">=1.5,<2.0"
  info:
    icon: https://docs.infrahub.app/img/infrahub-logo.svg
    description: Next generation source of truth for infrastructure management
    authors: [fatih]
    license: Apache-2.0
    links:
      - link: Homepage
        url: 'https://www.opsmill.com/'
      - link: Documentation
        url: 'https://docs.infrahub.app'
      - link: Github
        url: 'https://github.com/opsmill/infrahub'
  helm:
    main:
      location: oci://registry.opsmill.io/opsmill/chart/infrahub
      version: 4.33.2

  parameters:
    - name: replicas_server
      label: "Number of server replicas"
      kind: integer
      default: 1
    - name: replicas_task_worker
      label: "Number of task worker replicas"
      kind: integer
      default: 2
    - name: database_storage_size
      label: "Database storage size (Gi)"
      kind: integer
      default: 100
    - name: enable_analytics
      label: "Enable analytics"
      kind: boolean
      default: true

  # Doc-only declaration that the `server` and `task-worker` containers expose
  # an overridable `args` (014). Informational only — the actual wiring lives
  # in values.j2.yml. `command` is intentionally NOT advertised: the infrahub
  # chart's pod templates have no `command` field, so only `args` is overridable.
  container_overrides:
    - component: server
      container: infrahub-server
      args: true
      description: >-
        Override the API server container args (e.g. gunicorn worker count or
        logger class) for one deployment without forking the driver. `command`
        is not overridable — the chart wires only `args`.
    - component: task-worker
      container: infrahub-task-worker
      args: true
      description: >-
        Override the task worker container args (e.g. the Prefect pool or
        worker flags) for one deployment without forking the driver. `command`
        is not overridable — the chart wires only `args`.
    - component: task-manager
      container: prefect-server
      command: true
      args: true
      description: >-
        Override the task manager (Prefect server) container command and/or
        args for one deployment without forking the driver. When unset, the
        values template omits both keys (renders null, pruned on create /
        deleted on update) so the infrahub chart's own Prefect command/args
        defaults flow through — emitting an empty list instead would clobber
        them and force the prefect-server subchart's broken entrypoint fallback.

  components:
    server:
      container: infrahub-server
      cpu: 4
      identifier:
        label:
          service: infrahub-server
      backup:
        enabled: true
        kind: disk
        # Pod-template volume name mounted at /opt/infrahub/storage (artifact
        # content / object store). Required: without it the disk backup emits
        # no Velero backup-volumes annotation and silently captures nothing.
        volume: infrahub-server-storage-data

    task-worker:
      container: infrahub-task-worker
      identifier:
        label:
          service: infrahub-task-worker

    database:
      container: neo4j
      identifier:
        label:
          infrahub/service: database
      backup:
        enabled: true
        kind: neo4j

    cache:
      container: redis
      identifier:
        label:
          infrahub/service: cache

    message-queue:
      container: rabbitmq
      identifier:
        label:
          infrahub/service: message-queue

    task-manager:
      container: prefect-server
      identifier:
        label:
          app.kubernetes.io/name: prefect-server

    task-manager-db:
      container: postgresql
      identifier:
        label:
          infrahub/service: task-manager-db
      backup:
        enabled: true
        kind: postgres
        database_name: prefect

  services:
    - name: infrahub
      kind: http
      scope: internal
      port: 8000
      component: server

    # Prefect UI (and API at /api) served by the task-manager component.
    - name: task-manager
      kind: http
      scope: internal
      port: 4200
      component: task-manager

  actions:
    - name: upgrade
      hook: upgrade
      mode: core
      description: Upgrade Infrahub
      location: "actions.py::upgrade"

    - name: pre_setup
      hook: setup
      mode: pre
      description: Initial Setup of Infrahub
      location: "actions.py::pre_setup"

    - name: post_setup
      hook: setup
      mode: post
      description: Initial Setup of Infrahub
      location: "actions.py::post_setup"
