---
global:
  infrahubTag: "{{ app.version }}"
infrahub:
  fullnameOverride: styrmin-infrahub
  infrahubDemoData:
    enabled: false
  infrahubServer:
    ingress:
      enabled: true
      hostname: "{{ services.infrahub.primary_fqdn }}"
      extraHosts:
        - name: "{{ services.infrahub.human_readable_fqdn }}"
          path: /
    infrahubServer:
      # Hardcoded chart wiring + operator-supplied env vars for the `server`
      # component. The infrahub chart expects this as a map (key: value), not
      # a [{name, value}] list — see chart's templates/_env.tpl which does
      # `.Values.infrahubServer.infrahubServer.env.<KEY>` lookups directly.
      env:
        PREFECT_API_URL: "http://styrmin-task-manager:4200/api"
        INFRAHUB_WORKFLOW_ADDRESS: styrmin-task-manager
  {%- for entry in components | component_env_vars("server") %}
        {{ entry.name }}: {{ entry.value | tojson }}
  {%- endfor %}
  {%- if components | component_args("server") %}
      args: {{ components | component_args("server") | tojson }}
  {%- else %}
      args: null
  {%- endif %}
    persistence:
      accessMode: ReadWriteOnce
      enabled: true
      storageClassName: "{{ instance.config.standard_storage.storage_class }}"
    replicas: "{{ parameters.replicas_server }}"
  infrahubTaskWorker:
    infrahubTaskWorker:
      # Hardcoded chart wiring + operator-supplied env vars for the
      # `task-worker` component. Map shape — see infrahubServer note above.
      env:
        PREFECT_API_URL: "http://styrmin-task-manager:4200/api"
        INFRAHUB_WORKFLOW_ADDRESS: styrmin-task-manager
  {%- for entry in components | component_env_vars("task-worker") %}
        {{ entry.name }}: {{ entry.value | tojson }}
  {%- endfor %}
  {%- if components | component_args("task-worker") %}
      args: {{ components | component_args("task-worker") | tojson }}
  {%- else %}
      args: null
  {%- endif %}
    replicas: "{{ parameters.replicas_task_worker }}"
  nats:
    enabled: false
  neo4j:
    additionalVolumeMounts:
      - mountPath: /backup
        name: backup
    additionalVolumes:
      - emptyDir: {}
        name: backup
    # Operator-supplied env vars for the `database` component.
    env:
  {%- for entry in components | component_env_vars("database") %}
      {{ entry.name }}: {{ entry.value | tojson }}
  {%- endfor %}
    config:
      server.backup.enabled: "true"
    disableLookups: true
    fullnameOverride: styrmin-database
    services:
      admin:
        enabled: true
    volumes:
      data:
        dynamic:
          requests:
            storage: "{{ parameters.database_storage_size }}Gi"
          storageClassName: "{{ instance.config.fast_storage.storage_class }}"
        mode: dynamic
  nfs-server-provisioner:
    enabled: false
  prefect-server:
    enabled: true
    fullnameOverride: styrmin-task-manager
    # Expose the Prefect UI through the per-environment ingress
    ingress:
      enabled: true
      host:
        hostname: "{{ services['task-manager'].human_readable_fqdn }}"
        path: /
    server:
      # The Prefect UI is a SPA whose browser-side code calls the API at
      # PREFECT_UI_API_URL (default http://localhost:4200/api). Point it at the
      # ingress URL computed above so the UI works from outside the cluster,
      # mirroring compute_external_url: scheme defaults to https, port omitted
      # when it matches the scheme default (80/http, 443/https).
      {%- set tm_scheme = instance.config.external_url_scheme or "https" %}
      {%- set tm_port = instance.config.external_url_port %}
      {%- set tm_default_port = 80 if tm_scheme == "http" else 443 %}
      uiConfig:
        prefectUiApiUrl: "{{ tm_scheme }}://{{ services['task-manager'].human_readable_fqdn }}{% if tm_port and tm_port != tm_default_port %}:{{ tm_port }}{% endif %}/api"
      # Hardcoded analytics flag plus operator-supplied env vars for the
      # `task-manager` component.
      env:
        - name: PREFECT_SERVER_ANALYTICS_ENABLED
          value: "{{ parameters.enable_analytics }}"
    {%- for entry in components | component_env_vars("task-manager") %}
        - name: {{ entry.name | tojson }}
          value: {{ entry.value | tojson }}
    {%- endfor %}
    {%- if components | component_command("task-manager") %}
      command: {{ components | component_command("task-manager") | tojson }}
    {%- else %}
      command: null
    {%- endif %}
    {%- if components | component_args("task-manager") %}
      args: {{ components | component_args("task-manager") | tojson }}
    {%- else %}
      args: null
    {%- endif %}
    postgresql:
      # Propagate the styrmin identifier label to every resource the bitnami
      # postgresql subchart renders (StatefulSet metadata.labels included), so
      # the styrmin/component Kustomize patch can target the StatefulSet by
      # `infrahub/service=task-manager-db`. Without this, the chart only puts
      # the label on the pod template via podLabels.
      commonLabels:
        infrahub/service: task-manager-db
      architecture: standalone
      auth:
        database: prefect
        password: prefect-opsmill
        username: prefect
      enabled: true
      fullnameOverride: styrmin-postgresql
      image:
        tag: 14.13.0
      primary:
        # Operator-supplied env vars for the `task-manager-db` component.
        extraEnvVars: {{ components | component_env_vars("task-manager-db") | tojson }}
        persistence:
          enabled: true
          storageClass: "{{ instance.config.fast_storage.storage_class }}"
        extraVolumes:
          - name: backup
            emptyDir: {}
        extraVolumeMounts:
          - name: backup
            mountPath: /backup
        startupProbe:
          enabled: true
          initialDelaySeconds: 1
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 120
        readinessProbe:
          initialDelaySeconds: 1
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 120
        resourcesPreset: none
  rabbitmq:
    enabled: true
    fullnameOverride: styrmin-message-queue
    # See postgresql.commonLabels above — same reason: lift the identifier
    # label onto StatefulSet metadata so styrmin/component can attach.
    commonLabels:
      infrahub/service: message-queue
    auth:
      erlangCookie: styrmin-infrahub-supersecret
    # Operator-supplied env vars for the `message-queue` component.
    extraEnvVars: {{ components | component_env_vars("message-queue") | tojson }}
    startupProbe:
      enabled: true
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 120
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 120
    resourcesPreset: none
  redis:
    enabled: true
    fullnameOverride: styrmin-cache
    # See postgresql.commonLabels above — same reason: lift the identifier
    # label onto StatefulSet metadata so styrmin/component can attach.
    commonLabels:
      infrahub/service: cache
    master:
      # Operator-supplied env vars for the `cache` component.
      extraEnvVars: {{ components | component_env_vars("cache") | tojson }}
      startupProbe:
        enabled: true
        initialDelaySeconds: 1
        periodSeconds: 1
        timeoutSeconds: 1
        failureThreshold: 120
      readinessProbe:
        initialDelaySeconds: 1
        periodSeconds: 1
        timeoutSeconds: 1
        failureThreshold: 120
      resourcesPreset: none
