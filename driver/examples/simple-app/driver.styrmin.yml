---
apiVersion: "styrmin.io/v1"
kind: ApplicationDriver
metadata:
  name: simple-app
spec:
  version: "2"
  supported_versions: ">=0.1,<1.0"
  info:
    description: Simple 3-tier FastAPI application with PostgreSQL
    authors: [opsmill]
    license: Apache-2.0
  helm:
    main:
      location: simple-app
      version: 0.1.0

  components:
    server:
      container: simple-app
      identifier:
        label:
          app.kubernetes.io/name: simple-app

    database:
      container: postgresql
      identifier:
        label:
          app.kubernetes.io/name: postgresql
      backup:
        enabled: true
        kind: postgres
        database_name: simple_app

  env_vars:
    - name: LOG_LEVEL
      description: >-
        Application log verbosity. Doc-only — actual value comes from
        user-set deployment / environment env vars.
      level: deployment
    - name: DB_POOL_SIZE
      description: >-
        Connection pool size for the PostgreSQL database component.
      level: component
      components:
        - database

  # Doc-only declaration that the `server` component's container
  # command/args are overridable per deployment (014). Informational — the
  # platform never requires a declared component to actually wire the
  # filters; here `values.j2.yml` does wire them, so the override applies.
  container_overrides:
    - component: server
      container: simple-app
      command: true
      args: true
      description: >-
        Override the server container entrypoint/args (e.g. to run a worker
        mode or raise the log level) without forking the driver.

  services:
    - name: simple-app
      kind: http
      scope: internal
      port: 8000
      component: server

  actions:
    - name: upgrade
      hook: upgrade
      mode: core
      description: Upgrade Simple App
      location: "actions.py::upgrade"

    - name: pre_setup
      hook: setup
      mode: pre
      description: Pre-setup of Simple App
      location: "actions.py::pre_setup"

    - name: post_setup
      hook: setup
      mode: post
      description: Post-setup of Simple App
      location: "actions.py::post_setup"
