fullnameOverride: styrmin-simple-app

image:
  repository: simple-app
  tag: "{{ app.version }}"

# Operator-supplied container entrypoint/args overrides for the `server`
# component (014-component-container-overrides). The `component_command` /
# `component_args` filters return the operator's list, or `[]` when no override
# is set. We emit the keys UNCONDITIONALLY (always present in the rendered
# values) so that *clearing* an override propagates through the operator's
# JSON merge-patch HelmRelease apply — an omitted key would leave a prior
# override in place. The chart guards each with `{{- with .Values.command }}`,
# and an empty list is falsy there, so when unset the chart skips the key and
# the image ENTRYPOINT/CMD (or chart default) flows through. `command` and
# `args` are independent so one may be overridden while the other falls back.
command: {{ components | component_command("server") | tojson }}
args: {{ components | component_args("server") | tojson }}

# Operator-supplied env vars for the `server` component (env→dep→comp
# deepest-wins per spec 010). Per-component dict already includes the
# deployment-level env vars merged in, so the 008/009 E2E that asserts
# `LOG_LEVEL=debug` flows through to the server pod still passes.
extraEnv: {{ components | component_env_vars("server") | tojson }}

ingress:
  enabled: true
  className: "{{ instance.config.ingress_class }}"
  hosts:
    - host: "{{ services['simple-app'].primary_fqdn }}"
      paths:
        - path: /
          pathType: Prefix

database:
  host: styrmin-postgresql

postgresql:
  enabled: true
  fullnameOverride: styrmin-postgresql
  auth:
    username: simple-app
    password: simple-app-password
    database: simple_app
  primary:
    livenessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 60
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 60
    persistence:
      enabled: true
      size: 1Gi
    extraVolumes:
      - name: backup
        emptyDir: {}
    extraVolumeMounts:
      - name: backup
        mountPath: /backup
    # Operator-supplied env vars for the `database` component.
    extraEnvVars: {{ components | component_env_vars("database") | tojson }}
