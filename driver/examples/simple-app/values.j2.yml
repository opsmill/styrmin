fullnameOverride: styrmin-simple-app

image:
  repository: simple-app
  tag: "{{ app.version }}"

# Operator-supplied env vars (010-driver-env-var-consumption / US3).
# Consumes `instance.config.env_vars` (a `dict[str, str]` resolved env→dep
# deepest-wins by the platform; see specs/010-driver-env-var-consumption).
# Values are rendered through Jinja's `tojson` filter so YAML-significant
# characters (newlines, quotes, leading dashes, etc.) round-trip safely
# (FR-022). Empty dict / absent field renders an empty list `[]`; the chart
# template handles that case by simply concatenating an empty list onto the
# chart-default env entries (chart-default preservation, FR-014a).
extraEnv:
{%- for name, value in (instance.config.env_vars or {}).items() %}
  - name: {{ name | tojson }}
    value: {{ value | tojson }}
{%- else %}
  []
{%- endfor %}

ingress:
  enabled: true
  className: "{{ instance.config.ingress_class }}"
  hosts:
    - host: "{{ services['simple-app'].primary_fqdn }}"
      paths:
        - path: /
          pathType: Prefix

database:
  host: styrmin-postgresql

postgresql:
  enabled: true
  fullnameOverride: styrmin-postgresql
  auth:
    username: simple-app
    password: simple-app-password
    database: simple_app
  primary:
    livenessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 60
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 60
    persistence:
      enabled: true
      size: 1Gi
    extraVolumes:
      - name: backup
        emptyDir: {}
    extraVolumeMounts:
      - name: backup
        mountPath: /backup
