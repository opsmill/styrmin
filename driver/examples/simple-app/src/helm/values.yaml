replicaCount: 1

image:
  registry: ""
  repository: simple-app
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Container entrypoint/args for the simple-app server container
# (014-component-container-overrides). Both empty by default: the chart's
# deployment template guards each with ``{{- with .Values.command/args }}``, so
# an empty list is skipped and the image ENTRYPOINT (`uvicorn simple_app.main:app`)
# + CMD (`--host 0.0.0.0 --port 8000`) provide the runtime default. The driver's
# values.j2.yml always sets these from the operator's per-component override
# (or ``[]`` when unset), so clearing an override propagates through the
# operator's JSON merge-patch HelmRelease apply.
command: []
args: []

# DO NOT REMOVE — rendered as the `STYRMIN_CHART_DEFAULT` chart-default env
# entry that test_deployment_env_vars.py pins (it must survive user env vars).
chartDefaultMarker: "marker"

# Extra env entries appended to the simple-app container. Styrmin injects user
# env vars by post-render patch, not through this list; the E2E suite seeds it
# to simulate a deployment rendered before that change.
extraEnv: []

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: simple-app.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 1
  periodSeconds: 1
  timeoutSeconds: 1
  failureThreshold: 60

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 1
  periodSeconds: 1
  timeoutSeconds: 1
  failureThreshold: 60

nodeSelector: {}
tolerations: []
affinity: {}

# -- Database configuration
database:
  name: simple_app
  host: ""
  port: 5432
  username: ""
  password: ""

# -- Secret configuration
secrets:
  existingSecret: ""

# -- Bitnami PostgreSQL subchart
postgresql:
  enabled: true
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: simple-app
    password: simple-app-password
    database: simple_app
  primary:
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 60
    # -- Resource configuration for PostgreSQL primary
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits: {}
    persistence:
      enabled: true
      size: 1Gi
