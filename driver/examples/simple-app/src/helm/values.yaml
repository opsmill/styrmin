replicaCount: 1

image:
  registry: ""
  repository: simple-app
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# DO NOT REMOVE — pinned by
# backend/tests/e2e/test_deployment_env_vars.py::test_us1_deployment_level_env_var
# to assert chart-default env preservation per
# 010-driver-env-var-consumption / FR-014a. The chart's deployment template
# emits this as a hard-coded `STYRMIN_CHART_DEFAULT` env entry on the
# simple-app container; the test verifies the entry survives alongside any
# operator-supplied env vars (the load-bearing assertion vs 008's broken
# behaviour where chart-default entries were clobbered).
chartDefaultMarker: "marker"

# Operator-supplied env vars contributed by the driver's values.j2.yml
# (010-driver-env-var-consumption). The chart concatenates this list onto
# the chart-default env block; the platform never touches the chart-default
# entries directly. Empty by default — the driver template populates this
# field when operators set deployment-level env vars.
extraEnv: []

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: simple-app.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 1
  periodSeconds: 1
  timeoutSeconds: 1
  failureThreshold: 60

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 1
  periodSeconds: 1
  timeoutSeconds: 1
  failureThreshold: 60

nodeSelector: {}
tolerations: []
affinity: {}

# -- Database configuration
database:
  name: simple_app
  host: ""
  port: 5432
  username: ""
  password: ""

# -- Secret configuration
secrets:
  existingSecret: ""

# -- Bitnami PostgreSQL subchart
postgresql:
  enabled: true
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: simple-app
    password: simple-app-password
    database: simple_app
  primary:
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 60
    # -- Resource configuration for PostgreSQL primary
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits: {}
    persistence:
      enabled: true
      size: 1Gi
