[project]
name = "styrmin-mvp"
version = "0.1.11"
description = "Deployment orchestration platform for Kubernetes applications"
authors = [{name = "OpsMill", email = "info@opsmill.com"}]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.21.0",
    "styrmin-backend",
    "fast-depends>=2.4.12",
    "fastapi[standard]>=0.119.0",
    "gunicorn>=23.0.0",
    "kubernetes-asyncio>=33.3.0",
    "prefect[github]==3.6.25",
    "pydantic-settings>=2.12.0",
    "sqlmodel>=0.0.31",
    "strawberry-graphql>=0.288.4",
    "uvicorn>=0.40.0",
    "dulwich>=0.25.2",
    "prefect-kubernetes>=0.5.3",
    "loguru>=0.7.3",
    "coolname>=4.1.0",
    "deepdiff>=8.6.1",
    "rich>=14.2.0",
    "cyclopts>=3.0.0",
    "kopf>=1.37.0",
]


[dependency-groups]
dev = [
    "infrahub-sdk>=0.16",
    "invoke>=2.2.0",
    "kr8s>=0.20.15",
    "kubernetes-asyncio>=33.3.0",
    "pytest>=9",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.14.0",
    "pytest-opentelemetry>=0.8",
    "pytest-playwright-asyncio>=0.7",
    "pytest-xdist>=3.6.1",
    "opentelemetry-exporter-otlp>=1.25",
    "ruff>=0.14.14",
    "testcontainers>=4.14.0",
    "yamllint>=1.35.1",
    "rumdl>=0.1.50",
    "ariadne-codegen>=0.14",
    "ty>=0.0.24",
]

[tool.ty]

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["backend"]

[[tool.ty.overrides]]
include = ["**/_generated/**"]

[tool.ty.overrides.rules]
unused-type-ignore-comment = "ignore" # Generated code by ariadne-codegen — do not edit
invalid-assignment = "ignore" # Generated code by ariadne-codegen — do not edit

[[tool.ty.overrides]]
include = ["tasks/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore" # Upstream: invoke library @task decorator has incorrect return type annotations

[[tool.ty.overrides]]
include = ["backend/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore" # Upstream: Strawberry, SQLAlchemy, Jinja2, kubernetes-asyncio type stub mismatches (~98 violations)
invalid-assignment = "ignore" # Upstream: ty infers nested dict types too narrowly + test fakes intentionally violate types
invalid-await = "ignore" # Upstream: Prefect/SQLAlchemy async patterns ty doesn't resolve correctly
invalid-method-override = "ignore" # Upstream: Strawberry resolver method signatures differ from base
missing-argument = "ignore" # Upstream: Strawberry/SQLAlchemy constructor patterns
not-subscriptable = "ignore" # Upstream: Strawberry/SQLModel generic subscript patterns
possibly-missing-submodule = "ignore" # Upstream: auto-generated Alembic migrations use sqlmodel.sql.sqltypes
unknown-argument = "ignore" # Upstream: kubernetes-asyncio stubs missing _content_type param
unresolved-attribute = "ignore" # Upstream: Strawberry/SQLAlchemy/Prefect attribute resolution

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-await = "ignore" # Upstream: kopf decorators wrap async handlers in Protocol objects ty can't resolve
missing-argument = "ignore" # Upstream: kopf decorator Protocol signatures include extra params not passed in tests

[[tool.ty.overrides]]
include = ["driver/examples/db-test/src/**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore" # aiomysql and pymongo are not in root workspace venv — example-specific deps

[[tool.ty.overrides]]
include = ["python_sdk/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore" # Upstream: ty doesn't widen dict[str, str] to dict[str, JsonValue] for recursive type aliases
invalid-type-form = "ignore" # Upstream: ty bug — method named `list` shadows builtins.list in deferred annotations

[tool.uv]
package = false

[tool.uv.sources]
styrmin-backend = { path = "backend", editable = true }
styrmin-sdk = { workspace = true }

[tool.uv.workspace]
members = ["cli", "styrmin-backend", "python_sdk"]

[tool.ruff]
line-length = 120

exclude = [
    ".git",
    ".tox",
    ".venv",
    "env",
    "_build",
    "build",
    "dist",
    "examples",
    "_generated",
    "specs",
]


[tool.ruff.lint]
preview = true

task-tags = ["FIXME", "TODO", "XXX"]

select = ["ALL"]

ignore = [
    "D",      # pydocstyle
    "DOC",    # pydoclint
    "CPY",    # flake8-copyright
    "T201",   # use of `print`
    "ISC",    # flake8-implicit-str-concat
    "COM812", # missing-trailing-comma

    ##################################################################################################
    # Rules below needs to be Investigated                                                           #
    ##################################################################################################
    "PT",     # flake8-pytest-style
    "ERA",    # eradicate commented-out code
    "SLF001", # flake8-self
    "EM",     # flake8-errmsg
    "TRY",    # tryceratops
    "TD",     # flake8-todos
    "FIX",    # flake8-fixme
    "FBT",    # flake8-boolean-trap
    "G",      # flake8-logging-format
    "RSE",    # flake8-raise
    "A",      # flake8-builtins

    ##################################################################################################
    # The ignored rules below should be removed once the code has been updated, they are included    #
    # like this so that we can reactivate them one by one. Alternatively ignored after further       #
    # investigation if they are deemed to not make sense.                                            #
    ##################################################################################################
    "B008",    # Do not perform function call `typer.Option` in argument defaults; instead, perform the call within the function, or read the default from a module-level singleton variable
    "B904",    # Within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from None` to distinguish them from errors in exception handling
    "INP001",  # File declares a package, but is nested under an implicit namespace package.
    "PERF401", # Use a list comprehension to create a transformed list
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison
    "PLW0603", # Using the global statement to update `SETTINGS` is discouraged
    "PTH100",  # `os.path.abspath()` should be replaced by `Path.resolve()`
    "RET504",  # Unnecessary assignment to `data` before `return` statement
    "S701",    # By default, jinja2 sets `autoescape` to `False`. Consider using `autoescape=True`
    "SIM102",  # Use a single `if` statement instead of nested `if` statements
    "SIM105",  # Use `contextlib.suppress(KeyError)` instead of `try`-`except`-`pass`
    "TC003",   # Move standard library import `collections.abc.Iterable` into a type-checking block
    "UP031",   # Use format specifiers instead of percent format
]


#https://docs.astral.sh/ruff/formatter/black/
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["infrahub_sdk", "infrahub_ctl"]

[tool.ruff.lint.pycodestyle]
max-line-length = 150

[tool.ruff.lint.mccabe]
max-complexity = 10


[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR2004", # Magic value used in comparison
    "S101",    # Use of assert detected
    "S105",    # Possible hardcoded password assigned to variable
    "S106",    # Possible hardcoded password assigned to argument
    "ARG001",  # Unused function argument
    "ARG002",  # Unused method argument
    "ANN001", # Missing type annotation for function argument
    "ANN201", # ANN201 Missing return type annotation for public function
    "ANN202", # Missing return type annotation for private function
    "ANN204", # Missing return type annotation for special method
    "PLR6301", # Method could be a function, class method, or static method
    "PLC0415", # import should be at the top-level of a file
]
"*/tests/**/*.py" = [
    "PLR2004", # Magic value used in comparison
    "S101",    # Use of assert detected
    "S105",    # Possible hardcoded password assigned to variable
    "S106",    # Possible hardcoded password assigned to argument
    "ARG001",  # Unused function argument
    "ARG002",  # Unused method argument

    ##################################################################################################
    # Review and change the below later                                                              #
    ##################################################################################################
    "ANN001", # Missing type annotation for function argument
    "ANN201", # ANN201 Missing return type annotation for public function
    "ANN202", # Missing return type annotation for private function
    "ANN204", # Missing return type annotation for special method
    "PLR6301", # Method could be a function, class method, or static method
    "PLC0415", # import should be at the top-level of a file
]
"tasks/__init__.py" = [
    "RUF067", # __init__ module should only contain docstrings and re-exports (Invoke tasks pattern)
]
"cli/src/styrminctl/commands/*.py" = [
    "TC001", # Type aliases from types.py are used at runtime by Cyclopts for parameter resolution
]


[tool.ariadne-codegen]
schema_path = "schema.graphql"
queries_path = "python_sdk/src/styrmin_sdk/graphql"
target_package_name = "_generated"
target_package_path = "python_sdk/src/styrmin_sdk/graphql/"
async_client = true
convert_to_snake_case = true

[tool.ariadne-codegen.scalars.UUID]
type = "uuid.UUID"

[tool.ariadne-codegen.scalars.JSON]
type = "typing.Any"

[tool.ariadne-codegen.scalars.DateTime]
type = "datetime.datetime"

[tool.rumdl]
exclude = [".venv", "node_modules", "dev", ".claude", "specs", ".github/agents", ".specify/extensions", ".specify/templates", ".agents"]
disable = [
    "MD013",  # Line length
    "MD033",  # Inline HTML
    "MD041",  # First line in a file should be a top-level heading
    "MD057",  # Missing or broken relative links
    "MD060",  # Code blocks should have a language specified
]

[tool.rumdl.MD024]
siblings_only = true


[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
asyncio_mode = "auto"
addopts = "--tracing=retain-on-failure --video=retain-on-failure --screenshot=only-on-failure --browser=chromium"
filterwarnings = [
    # Third-party library deprecation warnings we can't fix directly
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
    "ignore:Passing a class to strawberry.scalar.*:DeprecationWarning",
    # SQLAlchemy warning about circular foreign key dependencies in test teardown
    "ignore:Can't sort tables for DROP.*:sqlalchemy.exc.SAWarning",
]
markers = [
    "e2e: end-to-end tests requiring a vCluster and external dependencies",
    "ci: e2e tests included in the CI pipeline",
    "api_only(reason): scenario runs only through the API entrypoint; [ui] variant is skipped with the given reason",
    "ui_only(reason): scenario runs only through the UI entrypoint; [api] variant is skipped with the given reason",
]
