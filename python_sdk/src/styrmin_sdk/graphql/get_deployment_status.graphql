query GetDeploymentStatus($deploymentId: UUID!) {
    deployment(deploymentId: $deploymentId) {
        name
        status
        crdStatus {
            phase
            message
            conditions {
                type
                status
                reason
                message
                lastTransitionTime
            }
            managedResourceCounts {
                networkPolicies
                secrets
                helmReleases
                services
                middlewares
            }
            lastPolledAt
        }
    }
}
