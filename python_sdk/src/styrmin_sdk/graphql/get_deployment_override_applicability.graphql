query GetDeploymentOverrideApplicability($deploymentId: UUID!) {
    deployment(deploymentId: $deploymentId) {
        id
        componentEnvVars {
            component
            isApplicable
        }
        componentImageOverrides {
            component
            isApplicable
        }
        componentContainerOverrides {
            component
            isApplicable
        }
        componentReplicas {
            component
            isApplicable
        }
    }
}
