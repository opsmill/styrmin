query ListDeployments(
    $environmentId: UUID!
    $includeDeleted: Boolean! = false
    $includeInternal: Boolean! = false
) {
    environment(environmentId: $environmentId) {
        deployments(includeDeleted: $includeDeleted, includeInternal: $includeInternal) {
            id
            name
            status
            applicationInstance {
                id
                status
            }
        }
    }
}
