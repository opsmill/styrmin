query GetDeployment($deploymentId: UUID!) {
    deployment(deploymentId: $deploymentId) {
        id
        name
        status
        deletedAt
        config
        applicationVersion
        applicationDriverVersionId
        applicationDriverVersion {
            version
            contentHash
            sourceCommitSha
        }
        environmentId
        createdBy {
            id
            username
            displayName
        }
        applicationInstance {
            id
            status
        }
        components {
            id
            name
            enabled
        }
        deployedServices {
            id
            driverServiceName
            resolvedName
            kind
            scope
            port
            component
            primaryFqdn
            humanReadableFqdn
            primaryUrl
            humanReadableUrl
        }
    }
}
