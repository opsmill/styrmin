mutation CreateEnvironmentBackup($environmentId: UUID!, $name: String) {
    createEnvironmentBackup(environmentId: $environmentId, name: $name) {
        id
        name
        status
        createdOn
        updatedOn
        environmentId
        environmentConfig
        deploymentSnapshots {
            deploymentId
            deploymentName
            instanceId
            driverName
            driverVersion
            driverFingerprint
            applicationVersion
            config
            parameters
        }
        constituents {
            deploymentId
            deploymentName
            error
            backup {
                id
                name
                status
                instanceId
                errorMessage
                sizeBytes
                startedAt
                completedAt
            }
        }
    }
}
