query GetDeploymentTimeline($deploymentId: UUID!) {
  deploymentTimeline(deploymentId: $deploymentId) {
    task {
      id
      type
      status
      message
      createdOn
      updatedOn
      startedByStepId
      steps {
        id
        key
        name
        kind
        status
        startedAt
        endedAt
        durationSeconds
        attemptCount
        errors {
          attempt
          message
          occurredAt
        }
        error
        detail
        hasOutput
      }
    }
    applicationVersion
    contextDiff {
      changes {
        path
        action
        oldValue
        newValue
      }
    }
  }
}
