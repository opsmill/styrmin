query GetBackup($backupId: UUID!) {
    backup(backupId: $backupId) {
        id
        name
        status
        instanceId
        instance {
            id
            applicationVersion
        }
        errorMessage
        startedAt
        completedAt
        sizeBytes
        createdOn
        updatedOn
        ttl
        expiresAt
        steps {
            id
            key
            name
            kind
            status
            startedAt
            endedAt
            durationSeconds
            attemptCount
            errors {
                attempt
                message
                occurredAt
            }
            error
            hasOutput
        }
    }
}
