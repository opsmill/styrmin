mutation LoadLocalApplicationDriverVersion($path: String!) {
    loadLocalApplicationDriverVersion(path: $path) {
        id
        applicationDriverId
        version
        contentHash
        sourceCommitSha
        supportedVersions
        components
        componentConfigs {
            id
            name
            config
            container
        }
        actions {
            name
            location
            image
        }
        helmChart {
            id
            name
            version
            repository
            valueTemplate
        }
    }
}
