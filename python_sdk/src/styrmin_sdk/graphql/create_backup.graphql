mutation CreateBackup($instanceId: UUID!, $name: String, $description: String) {
    createBackup(instanceId: $instanceId, name: $name, description: $description) {
        id
        name
        description
        status
        instanceId
        errorMessage
        startedAt
        completedAt
        sizeBytes
        createdOn
        updatedOn
        ttl
        expiresAt
    }
}
