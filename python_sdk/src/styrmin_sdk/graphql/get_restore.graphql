query GetRestore($restoreId: UUID!) {
    restore(restoreId: $restoreId) {
        id
        name
        status
        backupId
        targetNamespace
        targetInstanceId
        errorMessage
        startedAt
        completedAt
        createdOn
        updatedOn
        steps {
            id
            key
            name
            kind
            status
            startedAt
            endedAt
            durationSeconds
            attemptCount
            errors {
                attempt
                message
                occurredAt
            }
            error
            hasOutput
        }
    }
}
