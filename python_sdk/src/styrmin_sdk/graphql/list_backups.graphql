query ListBackups($instanceId: UUID!, $status: BackupStatus) {
    backups(instanceId: $instanceId, status: $status) {
        id
        name
        status
        instanceId
        errorMessage
        startedAt
        completedAt
        sizeBytes
        createdOn
        updatedOn
        ttl
        expiresAt
        steps {
            id
            key
            name
            kind
            status
            startedAt
            endedAt
            durationSeconds
            attemptCount
            errors {
                attempt
                message
                occurredAt
            }
            error
            hasOutput
        }
    }
}
