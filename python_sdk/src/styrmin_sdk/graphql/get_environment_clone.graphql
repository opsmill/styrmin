query GetEnvironmentClone($environmentCloneId: UUID!) {
    environmentClone(environmentCloneId: $environmentCloneId) {
        id
        name
        status
        sourceEnvironmentName
        createdOn
        updatedOn
        requestedDeploymentIds
        configOverride
        clearConfigFields
        cloneErrors
        sourceEnvironment {
            id
            name
        }
        environmentBackup {
            id
            name
            status
        }
        createdEnvironment {
            id
            name
            config
        }
        deploymentResults {
            deploymentId
            deploymentName
            outcome
            reason
            counterpartDeploymentId
            restoreId
        }
    }
}
