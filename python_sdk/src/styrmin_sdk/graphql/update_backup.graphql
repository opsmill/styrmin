mutation UpdateBackup($backupId: UUID!, $name: String, $description: String) {
    updateBackup(backupId: $backupId, name: $name, description: $description) {
        id
        name
        description
        status
        instanceId
        errorMessage
        startedAt
        completedAt
        sizeBytes
        createdOn
        updatedOn
        ttl
        expiresAt
    }
}
