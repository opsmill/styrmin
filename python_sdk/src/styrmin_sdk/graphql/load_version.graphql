mutation LoadRemoteApplicationDriverVersion(
    $repositoryUrl: String!
    $branch: String!
    $driverDirectory: String = null
) {
    loadRemoteApplicationDriverVersion(
        repositoryUrl: $repositoryUrl
        branch: $branch
        driverDirectory: $driverDirectory
    ) {
        id
        applicationDriverId
        applicationDriver {
            name
        }
        version
        contentHash
        sourceCommitSha
        sourceRepository
        sourceBranch
        sourcePath
        loadWarnings
        supportedVersions
        components
        componentConfigs {
            id
            name
            config
            container
        }
        actions {
            name
            location
            image
        }
        helmChart {
            id
            name
            version
            repository
            valueTemplate
        }
    }
}
