[project]
name = "styrmin-sdk"
version = "0.1.0"
description = "Python SDK for the Styrmin deployment orchestration platform"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "packaging>=24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.1,<7.0.0",
]

[project.scripts]
styrmin-driver = "styrmin_sdk.driver_format.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/styrmin_sdk"]
