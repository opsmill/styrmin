---
# Traefik ingress controller values for the local vCluster demo.
#
# service.spec.type is set to ClusterIP via `--set` in the invoke task
# `cluster.traefik`; the demo flow port-forwards svc/traefik on every
# platform rather than relying on a LoadBalancer.
#
# Usage: invoke cluster.traefik

ports:
  web:
    port: 80
    expose:
      default: true

providers:
  kubernetesIngress:
    publishedService:
      enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
