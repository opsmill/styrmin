---
# Helm values overrides for the one-command local demo on vCluster.
#
# Usage: invoke start (applied automatically via `helm upgrade --install`).
# The Cloudflare wildcard zone *.local.styrmin.io resolves to 127.0.0.1,
# so no /etc/hosts edit is needed.

image:
  # `invoke build` produces `registry.opsmill.io/opsmill/styrmin:latest`
  # locally; pinning the tag to `latest` makes the chart resolve to that
  # exact reference, which `pullPolicy: IfNotPresent` finds in the
  # vCluster's image store without contacting the registry. See
  # `helm/styrmin/README.md` "Running against a locally-built image".
  tag: latest
  pullPolicy: IfNotPresent

styrmin-agent:
  image:
    # The agent subchart defaults to its own appVersion (the released
    # image), so the locally-built tag has to be pinned here too.
    tag: latest
    pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: styrmin.local.styrmin.io
      paths:
        - path: /
          pathType: Prefix

styrmin:
  url:
    apiK8s: http://styrmin-server.styrmin.svc.cluster.local:8000
  # Local-demo convention (see ADR-016). Production installs MUST override.
  adminUsername: admin
  adminPassword: styrmin
  # The demo serves over plain HTTP at styrmin.local.styrmin.io:8080.
  # ``Secure`` cookies are dropped by browsers on non-HTTPS, non-localhost
  # origins, so disable the flag for the demo only.
  sessionCookieSecure: false

velero:
  backupsEnabled: false
  credentials:
    useSecret: false
