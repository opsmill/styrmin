[project]
name = "cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "styrmin-sdk",
    "typer>=0.16.0,<0.22.0",
    "rich>=13.0.0",
    "pydantic-settings>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/styrminctl"]

[project.scripts]
styrminctl = "styrminctl.cli:app"
