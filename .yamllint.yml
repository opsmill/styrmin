---
extends: default

ignore: |
  /.venv/
  /node_modules/
  /frontend/
  /backend/tests/**/fixtures/
  **/*.j2.yaml
  **/*.j2.yml
  /specs/
  /helm/**/*.yaml
  /.claude/worktrees/
  /.playwright-mcp/
  /.specify/extensions/
  /.specify/extensions.yml
  /driver/examples/simple-app/src/helm/
  /driver/examples/db-test/src/helm/templates/
  /docs/node_modules/
  /docs/pnpm-lock.yaml
  # Generated by `gh aw compile` from .github/workflows/*.md sources.
  /.github/workflows/*.lock.yml


rules:
  line-length:
    max: 200
  truthy:
    check-keys: false
