---
extends: default

ignore: |
  /.venv/
  /node_modules/
  /frontend/
  /backend/tests/**/fixtures/
  **/*.j2.yaml
  **/*.j2.yml
  /specs/
  /helm/**/*.yaml
  /.claude/worktrees/
  /.specify/extensions/
  /.specify/extensions.yml
  /driver/examples/simple-app/src/helm/
  /driver/examples/db-test/src/helm/templates/


rules:
  line-length:
    max: 200
  truthy:
    check-keys: false
