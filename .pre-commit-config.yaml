---
# Pre-commit hook configuration for Styrmin. See dev/guides/pre-commit-hooks.md.
# Works with both prek and pre-commit; no prek-only extensions.

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

# `driver/examples/` is excluded because nested pyproject.toml files there have
# their own ruff configs without the root project's ignore list, so the hook
# would lint files the project deliberately does not enforce. Other entries are
# generated artefacts and lockfiles.
exclude: |
  (?x)^(
      python_sdk/src/styrmin_sdk/graphql/_generated/.*
    | frontend/src/generated/.*
    | .*/__pycache__/.*
    | pnpm-lock\.yaml
    | uv\.lock
    | schema\.graphql
    | helm/.+/charts/.*
    | driver/examples/.*
    | specs/.*
    | \.specify/.*
    | \.agents/.*
    | \.claude/.*
    | api-collection/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-format
        args: [--check, --diff]
      - id: ruff-check

  # Local hooks shell out via `uv run` so versions stay aligned with
  # [dependency-groups].dev and CI; contributors don't need a parallel venv.
  - repo: local
    hooks:
      - id: ty
        name: ty type-check
        language: system
        entry: uv run ty check
        types: [python]
        pass_filenames: false

      - id: yamllint
        name: yamllint
        language: system
        entry: uv run yamllint
        types: [yaml]

      - id: rumdl
        name: rumdl markdown lint
        language: system
        entry: uv run rumdl check
        types: [markdown]
        pass_filenames: false

      - id: frontend-lint
        name: frontend lint (eslint + prettier)
        language: system
        entry: bash -c 'cd frontend && pnpm lint'
        files: ^frontend/.*\.(ts|tsx|js|jsx|css)$
        pass_filenames: false

      - id: validate-graphql
        name: validate GraphQL operations
        language: system
        entry: uv run invoke validate-graphql
        files: \.graphql$
        pass_filenames: false

      - id: helm-lint-agent
        name: helm lint (agent chart)
        language: system
        entry: bash -c 'helm lint ./helm/agent'
        files: ^helm/agent/
        pass_filenames: false

      - id: helm-lint-styrmin
        name: helm lint (styrmin chart)
        language: system
        entry: bash -c 'helm lint ./helm/styrmin'
        files: ^helm/styrmin/
        pass_filenames: false

      # Slow checks — pre-push only so they don't run on every commit.
      - id: graphql-schema-freshness
        name: GraphQL schema freshness (regenerate + diff)
        language: system
        entry: bash -c 'uv run styrmin export graphql-schema schema-check.graphql && diff schema.graphql schema-check.graphql && rm -f schema-check.graphql'
        files: ^(backend/styrmin_backend/api/schema/.*\.py|.*\.graphql)$
        pass_filenames: false
        stages: [pre-push]

      - id: generated-types-freshness
        name: Generated SDK + frontend types freshness
        language: system
        entry: uv run invoke generate-validate
        files: \.graphql$
        pass_filenames: false
        stages: [pre-push]
