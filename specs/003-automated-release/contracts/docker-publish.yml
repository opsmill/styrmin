# Contract: docker-publish.yml — Docker Build, Push, and Sign
#
# This document defines the interface contract for the Docker publishing workflow.
# It is NOT a runnable workflow — it specifies triggers, inputs, outputs,
# permissions, and job structure for implementation.

name: Publish Docker Image

# ─── Triggers ───────────────────────────────────────────────────────────
triggers:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: "Git tag or branch to build from (e.g., v0.1.1, develop)"
        required: true
      push:
        type: boolean
        description: "Whether to push the image to the registry"
        default: false
  workflow_call:
    inputs:
      tag:
        type: string
        description: "Git tag or branch to build from"
        required: true
      push:
        type: boolean
        description: "Whether to push the image to the registry"
        default: false
  push:
    branches:
      - develop  # Push latest on develop commits

# ─── Permissions ────────────────────────────────────────────────────────
permissions:
  contents: read
  id-token: write   # Required for cosign OIDC keyless signing

# ─── Secrets / Variables Required ───────────────────────────────────────
# secrets.HARBOR_USERNAME  — Harbor registry username
# secrets.HARBOR_PASSWORD  — Harbor registry password
# vars.HARBOR_HOST         — Harbor registry hostname

# ─── Jobs ───────────────────────────────────────────────────────────────
jobs:
  # ── Job 1: Build per-architecture images ─────────────────────────────
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm64
    runs-on: ${{ matrix.runner }}
    outputs:
      # Per-arch digests passed via artifacts (not outputs) due to matrix
    steps:
      - checkout at specified ref

      - setup Docker Buildx (docker/setup-buildx-action@v4)

      - login to Harbor (docker/login-action@v4):
          registry: vars.HARBOR_HOST
          username: secrets.HARBOR_USERNAME
          password: secrets.HARBOR_PASSWORD

      - build and push by digest (docker/build-push-action@v7):
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: inputs.push
          # No tags — push by digest only to avoid tag race between arches
          outputs: type=image,push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

      - export digest to file and upload as artifact

  # ── Job 2: Merge per-arch images into multi-arch manifest ────────────
  merge:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      digest: string   # Multi-arch manifest digest (sha256:...)
      tags: string     # Newline-separated list of applied tags
    steps:
      - download per-arch digest artifacts

      - setup Docker Buildx (docker/setup-buildx-action@v4)

      - login to Harbor (docker/login-action@v4)

      - compute Docker metadata (docker/metadata-action@v6):
          images: "{HARBOR_HOST}/opsmill/styrmin"
          tags:
            # On v* tag: version tag (e.g., 0.1.1)
            - type=semver,pattern={{version}}
            # Always: git SHA short
            - type=sha
            # On develop or v* tag: latest
            - type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v') }}

      - create multi-arch manifest:
          command: |
            docker buildx imagetools create \
              --tag <all-tags-from-metadata> \
              <amd64-digest> <arm64-digest>

      - inspect and output manifest digest

  # ── Job 3: Sign the multi-arch manifest ──────────────────────────────
  sign:
    needs: merge
    runs-on: ubuntu-24.04
    steps:
      - install cosign (sigstore/cosign-installer@v4)

      - sign manifest with cosign (keyless):
          # Sign the manifest LIST digest — covers both architectures
          command: |
            cosign sign --yes \
              ${HARBOR_HOST}/opsmill/styrmin@${MANIFEST_DIGEST}

# ─── Tag Matrix ─────────────────────────────────────────────────────────
#
# | Trigger          | Version Tag | SHA Tag | Latest | Architectures      |
# |------------------|-------------|---------|--------|--------------------|
# | v* tag push      | ✓           | ✓       | ✓      | amd64 + arm64      |
# | develop push     | ✗           | ✓       | ✓      | amd64 + arm64      |
# | workflow_dispatch| ✗           | ✓       | ✗      | amd64 + arm64      |
