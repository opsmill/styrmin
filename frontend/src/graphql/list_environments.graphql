query ListEnvironments($includeDeleted: Boolean = false) {
  environments {
    id
    name
    config
    cluster {
      id
      name
    }
    deployments(includeDeleted: $includeDeleted) {
      id
      name
      status
      deletedAt
      applicationVersion
      components {
        id
        name
        enabled
      }
    }
  }
}
