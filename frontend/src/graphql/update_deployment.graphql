mutation UpdateDeployment(
  $deploymentId: UUID!
  $name: String
  $config: JSON
  $parameters: JSON
  $serviceNameOverrides: [ServiceNameOverride!]
) {
  updateDeployment(
    deploymentId: $deploymentId
    name: $name
    config: $config
    parameters: $parameters
    serviceNameOverrides: $serviceNameOverrides
  ) {
    id
    type
    status
    message
    deploymentId
  }
}
