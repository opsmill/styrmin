mutation Deploy(
  $version: String
  $driver: String!
  $name: String
  $environmentId: UUID!
  $config: DeploymentConfigInput
  $parameters: [ParameterValueInput!]
  $serviceNameOverrides: [ServiceNameOverride!]
  $driverVersionId: UUID
) {
  deploy(
    version: $version
    driver: $driver
    name: $name
    environmentId: $environmentId
    config: $config
    parameters: $parameters
    serviceNameOverrides: $serviceNameOverrides
    driverVersionId: $driverVersionId
  ) {
    id
    type
    status
    message
    deploymentId
  }
}
