mutation Deploy(
  $version: String
  $driver: String!
  $name: String
  $environmentId: UUID!
  $config: JSON
  $parameters: JSON
  $serviceNameOverrides: [ServiceNameOverride!]
) {
  deploy(
    version: $version
    driver: $driver
    name: $name
    environmentId: $environmentId
    config: $config
    parameters: $parameters
    serviceNameOverrides: $serviceNameOverrides
  ) {
    id
    type
    status
    message
    deploymentId
  }
}
