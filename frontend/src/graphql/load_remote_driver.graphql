mutation LoadRemoteDriver(
  $repositoryUrl: String!
  $branch: String!
  $driverDirectory: String = null
) {
  loadRemoteApplicationDriverVersion(
    repositoryUrl: $repositoryUrl
    branch: $branch
    driverDirectory: $driverDirectory
  ) {
    id
    version
    contentHash
    sourceCommitSha
    applicationDriverId
    loadWarnings
  }
}
