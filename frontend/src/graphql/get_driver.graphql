query GetDriver($applicationDriverId: UUID!) {
  applicationDriver(applicationDriverId: $applicationDriverId) {
    id
    name
    createdOn
    versions {
      id
      version
      supportedVersions
      sourceType
      sourceRepository
      sourceBranch
      sourcePath
      driverDirectory
      sourceCommitSha
      contentHash
      components
      createdOn
      icon
      description
      links {
        label
        url
      }
      parameters {
        name
        label
        kind
        default
        values
      }
      componentConfigs {
        id
        name
        config
        container
        replicas
        singleton
      }
      helmChart {
        id
        name
        version
        repository
        valueTemplate
      }
      actions {
        id
        name
        description
        location
      }
    }
  }
}
