query GetDeployment($deploymentId: UUID!) {
  deployment(deploymentId: $deploymentId) {
    id
    name
    status
    deletedAt
    config
    parameters
    applicationVersion
    applicationDriverVersionId
    applicationDriverVersion {
      id
      version
      contentHash
      sourceCommitSha
      applicationDriver {
        id
        name
      }
      parameters {
        name
        label
        kind
        default
        values
      }
    }
    environmentId
    environment {
      id
      name
      config
      cluster {
        id
        name
        config
      }
    }
    applicationInstance {
      id
      name
      status
      applicationVersion
      applicationDriverVersionId
      deploymentId
    }
    components {
      id
      name
      enabled
    }
    deployedServices {
      id
      driverServiceName
      resolvedName
      kind
      port
      primaryFqdn
      humanReadableFqdn
      primaryUrl
      humanReadableUrl
    }
  }
}
