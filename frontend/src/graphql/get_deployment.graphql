query GetDeployment($deploymentId: UUID!) {
  deployment(deploymentId: $deploymentId) {
    id
    name
    status
    deletedAt
    config
    parameters
    applicationVersion
    applicationDriverVersionId
    applicationDriverVersion {
      id
      version
      contentHash
      sourceCommitSha
      applicationDriver {
        id
        name
      }
      parameters {
        name
        label
        kind
        default
        values
      }
      componentConfigs {
        name
        replicas
      }
    }
    environmentId
    environment {
      id
      name
      config
      cluster {
        id
        name
        config
      }
    }
    applicationInstance {
      id
      name
      status
      applicationVersion
      applicationDriverVersionId
      deploymentId
    }
    components {
      id
      name
      enabled
      container
    }
    componentImageOverrides {
      component
      reference
      resolvedReference
      isOrphaned
      isApplicable
    }
    componentContainerOverrides {
      component
      command
      args
      isOrphaned
      isApplicable
    }
    componentReplicas {
      component
      count
      source
      override
      singleton
      isOrphaned
      isApplicable
    }
    deployedServices {
      id
      driverServiceName
      resolvedName
      kind
      scope
      port
      primaryFqdn
      humanReadableFqdn
      primaryUrl
      humanReadableUrl
      ingressClass
      ingressClassOverridden
      fqdnSuffixOverridden
    }
  }
}
