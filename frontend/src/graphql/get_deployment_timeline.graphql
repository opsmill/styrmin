query GetDeploymentTimeline($deploymentId: UUID!) {
  deploymentTimeline(deploymentId: $deploymentId) {
    task {
      id
      type
      status
      message
      createdOn
      updatedOn
      result
      startedByStepId
      startedBy {
        id
        type
      }
      startedTasks {
        id
        type
        result
      }
      steps {
        id
        key
        name
        kind
        status
        startedAt
        endedAt
        durationSeconds
        attemptCount
        errors {
          attempt
          message
          occurredAt
        }
        error
        detail
        rolledBackAt
        rollbackMessage
        hasOutput
        outputTruncated
        supersededBy {
          id
          type
        }
        startedTasks {
          id
          type
          result
        }
      }
    }
    applicationVersion
    contextDiff {
      changes {
        path
        action
        oldValue
        newValue
      }
    }
  }
}
