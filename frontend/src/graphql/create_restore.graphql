mutation CreateRestore(
  $backupId: UUID!
  $targetNamespace: String!
  $targetInstanceId: UUID
) {
  createRestore(
    backupId: $backupId
    targetNamespace: $targetNamespace
    targetInstanceId: $targetInstanceId
  ) {
    id
    name
    status
    backupId
    targetNamespace
    targetInstanceId
    errorMessage
    createdOn
  }
}
