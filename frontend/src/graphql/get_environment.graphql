query GetEnvironment($environmentId: UUID!, $includeDeleted: Boolean = false) {
  environment(environmentId: $environmentId) {
    id
    name
    config
    cluster {
      id
      name
    }
    backupStorageLocation {
      id
      name
    }
    deployments(includeDeleted: $includeDeleted) {
      id
      name
      status
      deletedAt
      internal
      applicationVersion
      applicationDriverVersionId
      components {
        id
        name
        enabled
      }
      applicationInstance {
        id
        status
      }
    }
  }
}
