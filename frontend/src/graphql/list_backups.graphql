query ListBackups($instanceId: UUID!) {
  backups(instanceId: $instanceId) {
    id
    name
    status
    createdOn
    completedAt
    sizeBytes
    errorMessage
    ttl
    expiresAt
    steps {
      id
      key
      name
      kind
      status
      startedAt
      endedAt
      durationSeconds
      attemptCount
      error
      errors {
        attempt
        message
        occurredAt
      }
    }
  }
}
