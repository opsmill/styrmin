query ListBackups($deploymentId: UUID!) {
  backups(deploymentId: $deploymentId) {
    id
    name
    status
    createdOn
    completedAt
    sizeBytes
    errorMessage
    ttl
    expiresAt
    instance {
      id
      applicationVersion
    }
    steps {
      id
      key
      name
      kind
      status
      startedAt
      endedAt
      durationSeconds
      attemptCount
      error
      errors {
        attempt
        message
        occurredAt
      }
    }
  }
}
