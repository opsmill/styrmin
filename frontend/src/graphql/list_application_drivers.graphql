query ListApplicationDrivers {
  applicationDrivers {
    id
    name
    versions {
      id
      version
      supportedVersions
      defaultVersion
      createdOn
      contentHash
      sourceCommitSha
      parameters {
        name
        label
        kind
        default
        values
      }
      componentConfigs {
        name
        replicas
        singleton
      }
    }
  }
}
