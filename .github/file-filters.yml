---
documentation: &documentation
  - 'docs/**/*'

documentation_all:
  - *documentation

python: &python
  - '**/*.py'
  - 'pyproject.toml'
  - 'uv.lock'

python_all:
  - *python

yaml: &yaml
  - '**/*.yml'
  - '**/*.yaml'
  - '!.github/workflows/**'

yaml_all:
  - *yaml

markdown: &markdown
  - '**/*.md'
  - '**/*.mdx'

markdown_all:
  - *markdown

helm: &helm
  - 'helm/**'

helm_all:
  - *helm
