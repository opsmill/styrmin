    directory: /
    schedule:
      interval: weekly
      day: monday
      time: 03:00
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
