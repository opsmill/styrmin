---
name: CI
# yamllint disable rule:truthy rule:line-length
on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      enable-e2e-tracing:
        description: "Enable OpenTelemetry tracing for E2E tests"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  files-changed:
    name: Detect which file has changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      documentation: ${{ steps.changes.outputs.documentation_all }}
      python: ${{ steps.changes.outputs.python_all }}
      yaml: ${{ steps.changes.outputs.yaml_all }}
      markdown: ${{ steps.changes.outputs.markdown_all }}
      helm: ${{ steps.changes.outputs.helm_all }}
      docs_only: ${{ steps.docs-only.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: .github/file-filters.yml
      # Returns 'true' only when *every* changed file matches a docs pattern.
      # Used by the E2E jobs to skip on doc-only PRs.
      - name: Check if only docs changed
        uses: dorny/paths-filter@v3
        id: docs-only
        with:
          predicate-quantifier: every
          filters: |
            docs_only:
              - 'docs/**'
              - '**/*.md'
              - '**/*.mdx'

  python-lint:
    name: Python Linting
    # if: needs.files-changed.outputs.python == 'true'
    # needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync --all-packages
      - name: Check code formatting
        run: uv run ruff format --check --diff
      - name: Run linters
        run: uv run ruff check
      - name: Run type checker
        run: uv run ty check

  yaml-lint:
    name: YAML Linting
    # if: needs.files-changed.outputs.yaml == 'true'
    # needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Run yamllint
        run: uv run yamllint .

  helm-lint:
    name: Helm Lint
    if: needs.files-changed.outputs.helm == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Lint agent chart
        run: |
          helm dependency update ./helm/agent
          helm lint ./helm/agent
      - name: Lint styrmin chart
        run: |
          helm dependency update ./helm/styrmin
          helm lint ./helm/styrmin

  graphql-schema-check:
    name: GraphQL Schema Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync --all-packages
      - name: Export GraphQL schema
        run: uv run styrmin export graphql-schema schema-check.graphql
      - name: Check schema is up to date
        run: |
          if ! diff schema.graphql schema-check.graphql; then
            echo "::error::GraphQL schema is out of date. Run 'uv run styrmin export graphql-schema schema.graphql' and commit the result."
            exit 1
          fi

  graphql-operations-check:
    name: GraphQL Operations Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync --all-packages
      - name: Validate GraphQL operations against schema
        run: uv run invoke validate-graphql

  markdown-lint:
    name: Markdown Linting
    # if: needs.files-changed.outputs.markdown == 'true'
    # needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Run rumdl
        run: uv run rumdl check .

  pre-commit-hooks:
    name: Pre-Commit Hooks
    # Runs both stages of .pre-commit-config.yaml on every PR so the hook
    # config cannot drift from the per-tool jobs above. The per-tool jobs are
    # kept in place during the parity-validation period.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync --all-packages
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies (needed by frontend-lint hook)
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Install Helm (needed by helm-lint hooks)
        uses: azure/setup-helm@v4
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock', 'frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-
      - name: Run pre-commit hooks (pre-commit stage)
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Run pre-commit hooks (pre-push stage)
        run: uv run pre-commit run --hook-stage pre-push --all-files --show-diff-on-failure

  frontend-lint:
    name: Frontend Linting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run ESLint and Prettier check
        run: pnpm lint

  frontend-test:
    name: Frontend Tests
    needs: ["frontend-lint"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        run: pnpm test

  frontend-build:
    name: Frontend Build
    needs: ["frontend-lint", "frontend-test"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build frontend (includes tsc)
        run: pnpm build

  sdk-codegen-check:
    name: SDK GraphQL Codegen Check
    needs: ["graphql-operations-check"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync --all-packages
      - name: Run codegen
        run: uv run ariadne-codegen
      - name: Check generated types are up to date
        run: |
          if [ -n "$(git diff --name-only)" ]; then
            echo "::error::SDK GraphQL generated types are out of date. Run 'uv run invoke generate' and commit the result."
            git diff
            exit 1
          fi

  frontend-codegen-check:
    name: Frontend GraphQL Codegen Check
    needs: ["frontend-lint"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run codegen
        run: pnpm codegen
      - name: Check generated types are up to date
        run: |
          if [ -n "$(git diff --name-only)" ]; then
            echo "::error::Frontend GraphQL generated types are out of date. Run 'pnpm codegen' in frontend/ and commit the result."
            git diff
            exit 1
          fi

  unit-tests:
    name: Unit Tests
    needs: ["python-lint", "yaml-lint", "markdown-lint", "graphql-schema-check", "graphql-operations-check"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync --all-packages
      - name: Run unit tests
        run: uv run pytest -v backend/tests/unit

  e2e-tests-api:
    name: E2E Tests (API entrypoint)
    needs: ["files-changed", "python-lint", "yaml-lint", "markdown-lint", "graphql-schema-check"]
    if: github.event_name == 'workflow_dispatch' || needs.files-changed.outputs.docs_only != 'true'
    runs-on:
      group: huge-runners
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: loft-sh/setup-vcluster@68e17a8c3618e3c47d635842b803d4f560f694e8
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync --all-packages
      - name: Install tini
        run: apt-get update && apt-get install -y tini
      - name: "Set environment variables"
        run: |
          RUNNER_NAME=$(echo "${{ runner.name }}" | grep -o 'ghrunner[0-9]\+' | sed 's/ghrunner\([0-9]\+\)/ghrunner_\1/')
          echo "VCLUSTER_DIR=/var/lib/github/${RUNNER_NAME}/_temp/.vcluster/config.json" >> $GITHUB_ENV
      - name: Enable E2E tracing
        if: inputs.enable-e2e-tracing == true
        run: |
          echo "OTEL_SERVICE_NAME=styrmin-e2e-tests-api" >> $GITHUB_ENV
          echo "OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.TRACING_ENDPOINT }}" >> $GITHUB_ENV
          echo "OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}" >> $GITHUB_ENV
          echo "OTEL_EXPORTER_OTLP_PROTOCOL=grpc" >> $GITHUB_ENV
          echo "OTEL_RESOURCE_ATTRIBUTES=github.run_id=${GITHUB_RUN_ID}" >> $GITHUB_ENV
          echo "PYTEST_OTEL_ARGS=--export-traces" >> $GITHUB_ENV
      # Use tini to properly propagate cancellation signal to pytest, so that containers are properly destroyed
      - name: Run E2E tests (API variants)
        run: exec tini -s -g -- uv run pytest -v -m ci -k "api-chromium" ${PYTEST_OTEL_ARGS:-} backend/tests/e2e

  e2e-tests-ui:
    name: E2E Tests (UI entrypoint)
    needs: ["files-changed", "python-lint", "yaml-lint", "markdown-lint", "graphql-schema-check"]
    if: github.event_name == 'workflow_dispatch' || needs.files-changed.outputs.docs_only != 'true'
    runs-on:
      group: huge-runners
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: loft-sh/setup-vcluster@68e17a8c3618e3c47d635842b803d4f560f694e8
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync --all-packages
      - name: Install Playwright browser + system deps
        run: |
          uv run playwright install chromium
          uv run playwright install-deps chromium
      # Build an LD_PRELOAD shim that fails NETLINK_ROUTE sockets with
      # EAFNOSUPPORT so Chromium's AddressTrackerLinux takes its graceful
      # "assume always online" path. Avoids netlink-driven flake on
      # self-hosted runners without touching the browser binary.
      - name: Build no-netlink shim
        run: |
          apt-get update && apt-get install -y gcc
          gcc -shared -fPIC -Wall -Wextra \
            -o "$RUNNER_TEMP/no_netlink.so" \
            backend/tests/e2e/fixtures/no_netlink.c -ldl
          echo "NO_NETLINK_SO=$RUNNER_TEMP/no_netlink.so" >> "$GITHUB_ENV"
      - name: Install tini
        run: apt-get update && apt-get install -y tini
      - name: "Set environment variables"
        run: |
          RUNNER_NAME=$(echo "${{ runner.name }}" | grep -o 'ghrunner[0-9]\+' | sed 's/ghrunner\([0-9]\+\)/ghrunner_\1/')
          echo "VCLUSTER_DIR=/var/lib/github/${RUNNER_NAME}/_temp/.vcluster/config.json" >> $GITHUB_ENV
      - name: Enable E2E tracing
        if: inputs.enable-e2e-tracing == true
        run: |
          echo "OTEL_SERVICE_NAME=styrmin-e2e-tests-ui" >> $GITHUB_ENV
          echo "OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.TRACING_ENDPOINT }}" >> $GITHUB_ENV
          echo "OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}" >> $GITHUB_ENV
          echo "OTEL_EXPORTER_OTLP_PROTOCOL=grpc" >> $GITHUB_ENV
          echo "OTEL_RESOURCE_ATTRIBUTES=github.run_id=${GITHUB_RUN_ID}" >> $GITHUB_ENV
          echo "PYTEST_OTEL_ARGS=--export-traces" >> $GITHUB_ENV
      # Use tini to properly propagate cancellation signal to pytest, so that containers are properly destroyed
      - name: Run E2E tests (UI variants)
        run: exec tini -s -g -- uv run pytest -v -m ci -k "ui-chromium" ${PYTEST_OTEL_ARGS:-} backend/tests/e2e
      - name: Upload Playwright diagnostic artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
