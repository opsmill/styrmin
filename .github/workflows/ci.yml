---
name: CI
# yamllint disable rule:truthy rule:line-length
on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      enable-e2e-tracing:
        description: "Enable OpenTelemetry tracing for E2E tests"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  files-changed:
    name: Detect which file has changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      non_runtime_only: ${{ steps.non-runtime-only.outputs.non_runtime_only }}
    steps:
      - uses: actions/checkout@v6
      # Returns 'true' only when *every* changed file matches a non-runtime pattern.
      # Used by the E2E jobs to skip on tooling-only PRs (docs, agent config, etc.).
      - name: Check if only non-runtime files changed
        uses: dorny/paths-filter@v3
        id: non-runtime-only
        with:
          predicate-quantifier: every
          filters: |
            non_runtime_only:
              - 'docs/**'
              - '**/*.md'
              - '**/*.mdx'
              - '.specify/**'
              - '.agents/**'
              - '.github/prompts/**'
              - 'LICENSE*'
              - 'CODEOWNERS'

  pre-commit-hooks:
    name: Pre-Commit Hooks
    # Runs both stages of .pre-commit-config.yaml on every PR. This is the
    # canonical lint/format/freshness gate for the repo — every downstream
    # job (tests, build, E2E) waits on it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies (needed by frontend-lint hook)
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Install Helm (needed by helm-lint hooks)
        uses: azure/setup-helm@v4
      - name: Install prek
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/j178/prek/releases/download/v0.3.11/prek-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache prek environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock', 'frontend/pnpm-lock.yaml') }}
          restore-keys: |
            prek-${{ runner.os }}-
      - name: Run pre-commit hooks (pre-commit stage)
        run: prek run --all-files --show-diff-on-failure
      - name: Run pre-commit hooks (pre-push stage)
        run: prek run --hook-stage pre-push --all-files --show-diff-on-failure

  frontend-test:
    name: Frontend Tests
    needs: ["pre-commit-hooks"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        run: pnpm test

  frontend-build:
    name: Frontend Build
    needs: ["pre-commit-hooks", "frontend-test"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build frontend (includes tsc)
        run: pnpm build

  unit-tests:
    name: Unit Tests
    needs: ["pre-commit-hooks"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Run unit tests
        # Integration tests and one styrmin-deployment timer test require the
        # vcluster CLI, which isn't installed on this runner — they're tracked
        # for a follow-up PR that wires vcluster into the Unit Tests job.
        run: >-
          uv run pytest -v
          --ignore=backend/tests/e2e
          --ignore=backend/tests/integration
          --deselect=backend/tests/unit/test_styrmin_deployment_timer.py::test_timer_still_trips_timeout_for_non_restoring_phase
          backend/tests

  cli-tests:
    name: CLI Unit Tests
    needs: ["pre-commit-hooks"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Run CLI unit tests
        run: uv run pytest -v cli/tests

  sdk-tests:
    name: Python SDK Unit Tests
    needs: ["pre-commit-hooks"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Run Python SDK unit tests
        run: uv run pytest -v python_sdk/tests

  e2e-tests:
    name: E2E Tests (${{ matrix.entrypoint }} / ${{ matrix.shard }})
    needs: ["files-changed", "pre-commit-hooks"]
    if: github.event_name == 'workflow_dispatch' || needs.files-changed.outputs.non_runtime_only != 'true'
    runs-on:
      group: huge-runners
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        entrypoint: [api, ui]
        shard: [readonly, mutation_small, mutation_large, ingress, backup, infrahub]
        exclude:
          # Shards that are entirely api_only (no UI surface to exercise)
          - {entrypoint: ui, shard: backup}
    steps:
      - uses: actions/checkout@v6
      - uses: loft-sh/setup-vcluster@68e17a8c3618e3c47d635842b803d4f560f694e8
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Install Playwright browser + system deps
        if: matrix.entrypoint == 'ui'
        run: |
          uv run playwright install chromium
          uv run playwright install-deps chromium
      - name: Build no-netlink shim
        if: matrix.entrypoint == 'ui'
        run: |
          apt-get update && apt-get install -y gcc
          gcc -shared -fPIC -Wall -Wextra \
            -o "$RUNNER_TEMP/no_netlink.so" \
            backend/tests/e2e/fixtures/no_netlink.c -ldl
          echo "NO_NETLINK_SO=$RUNNER_TEMP/no_netlink.so" >> "$GITHUB_ENV"
      - name: Install tini
        run: apt-get update && apt-get install -y tini
      - name: "Set environment variables"
        run: |
          RUNNER_NAME=$(echo "${{ runner.name }}" | grep -o 'ghrunner[0-9]\+' | sed 's/ghrunner\([0-9]\+\)/ghrunner_\1/')
          echo "VCLUSTER_DIR=/var/lib/github/${RUNNER_NAME}/_temp/.vcluster/config.json" >> $GITHUB_ENV
          echo "STYRMIN_IMAGE_VER=local-${{ runner.name }}-${{ github.sha }}-${{ matrix.shard }}-${{ matrix.entrypoint }}" >> $GITHUB_ENV
      - name: Enable E2E tracing
        if: inputs.enable-e2e-tracing == true
        run: |
          echo "OTEL_SERVICE_NAME=styrmin-e2e-${{ matrix.entrypoint }}-${{ matrix.shard }}" >> $GITHUB_ENV
          echo "OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.TRACING_ENDPOINT }}" >> $GITHUB_ENV
          echo "OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}" >> $GITHUB_ENV
          echo "OTEL_EXPORTER_OTLP_PROTOCOL=grpc" >> $GITHUB_ENV
          echo "OTEL_RESOURCE_ATTRIBUTES=github.run_id=${GITHUB_RUN_ID}" >> $GITHUB_ENV
          echo "PYTEST_OTEL_ARGS=--export-traces" >> $GITHUB_ENV
      - name: Run E2E tests
        run: |
          exec tini -s -g -- uv run pytest -v \
            -m "ci and shard_${{ matrix.shard }}" \
            -k "${{ matrix.entrypoint }}-chromium" \
            ${PYTEST_OTEL_ARGS:-} \
            backend/tests/e2e
      - name: Upload Playwright diagnostic artifacts
        if: failure() && matrix.entrypoint == 'ui'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
