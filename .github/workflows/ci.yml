---
name: CI
# yamllint disable rule:truthy rule:line-length
on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      enable-e2e-tracing:
        description: "Enable OpenTelemetry tracing for E2E tests"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  files-changed:
    name: Detect which file has changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      non_runtime_only: ${{ steps.non-runtime-only.outputs.non_runtime_only }}
    steps:
      - uses: actions/checkout@v6
      # Returns 'true' only when *every* changed file matches a non-runtime pattern.
      # Used by the E2E jobs to skip on tooling-only PRs (docs, agent config, etc.).
      - name: Check if only non-runtime files changed
        uses: dorny/paths-filter@v3
        id: non-runtime-only
        with:
          predicate-quantifier: every
          filters: |
            non_runtime_only:
              - 'docs/**'
              - '**/*.md'
              - '**/*.mdx'
              - '.specify/**'
              - '.agents/**'
              - '.github/prompts/**'
              - 'LICENSE*'
              - 'CODEOWNERS'

  pre-commit-hooks:
    name: Pre-Commit Hooks
    # Runs both stages of .pre-commit-config.yaml on every PR. This is the
    # canonical lint/format/freshness gate for the repo — every downstream
    # job (tests, build, E2E) waits on it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies (needed by frontend-lint hook)
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Install Helm (needed by helm-lint hooks)
        uses: azure/setup-helm@v4
      - name: Install prek
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/j178/prek/releases/download/v0.3.11/prek-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache prek environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock', 'frontend/pnpm-lock.yaml') }}
          restore-keys: |
            prek-${{ runner.os }}-
      - name: Run pre-commit hooks (pre-commit stage)
        run: prek run --all-files --show-diff-on-failure
      - name: Run pre-commit hooks (pre-push stage)
        run: prek run --hook-stage pre-push --all-files --show-diff-on-failure

  frontend-test:
    name: Frontend Tests
    needs: ["pre-commit-hooks"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        run: pnpm test

  frontend-build:
    name: Frontend Build
    needs: ["pre-commit-hooks", "frontend-test"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build frontend (includes tsc)
        run: pnpm build

  unit-tests:
    name: Unit Tests
    needs: ["pre-commit-hooks"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Run unit tests
        # E2E and integration tests need vcluster — they run in dedicated jobs.
        run: >-
          uv run pytest -v
          --ignore=backend/tests/e2e
          --ignore=backend/tests/integration
          backend/tests

  cli-tests:
    name: CLI Unit Tests
    needs: ["pre-commit-hooks"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Run CLI unit tests
        run: uv run pytest -v cli/tests

  sdk-tests:
    name: Python SDK Unit Tests
    needs: ["pre-commit-hooks"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Run Python SDK unit tests
        run: uv run pytest -v python_sdk/tests

  integration-tests:
    name: Integration Tests
    needs: ["files-changed", "pre-commit-hooks"]
    if: github.event_name == 'workflow_dispatch' || needs.files-changed.outputs.non_runtime_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Show runner resources
        run: nproc && free -h && df -h /
      - uses: loft-sh/setup-vcluster@68e17a8c3618e3c47d635842b803d4f560f694e8
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Run integration tests
        run: uv run pytest -v backend/tests/integration

  e2e-tests:
    name: E2E Tests (${{ matrix.entrypoint }} / ${{ matrix.shard }})
    needs: ["files-changed", "pre-commit-hooks"]
    if: github.event_name == 'workflow_dispatch' || needs.files-changed.outputs.non_runtime_only != 'true'
    runs-on: ubuntu-latest
    # Raised from 40 because a cell's *worst case* has to leave room for the
    # test's own diagnostic. A wait that overruns raises an AssertionError naming
    # the deployment, the observed state and the budget; a cell killed on
    # timeout-minutes produces none of that, which is strictly worse to debug —
    # and shard_env_backup is the cell where it bites, since it runs the two
    # environment-level lifecycle nodes under *both* entrypoints.
    #
    # test_environment_backup_and_restore_lifecycle alone sums to ~48 minutes of
    # worst-case waits after those budgets were tightened (see the named
    # constants in test_backup_restore.py). It cannot go lower without dropping
    # below values the repo already calibrated in the backup shards — 480s for
    # an env-config redeploy fanout (009), 600s for one Velero restore plus the
    # post-restore reapply (test_restore_lifecycle_transitions), 300s for a
    # deployment to reach RUNNING. Observed locally the same node takes 328s of
    # body time (463s including full session bootstrap), so the ceiling is ~9x
    # the real cost: it exists to bound a pathological run, not to pace a normal
    # one.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        entrypoint: [api, ui]
        shard: [general, env, compute, backup, env_backup, infrahub, configuration, apply, task_steps]
        exclude:
          # A cell is excluded only when *every* test it would collect is
          # marked for the other entrypoint. Selecting zero tests makes pytest
          # exit 5, which fails the cell after paying full vcluster boot time —
          # so the exclusion is about an empty collection, not about saving time
          # on tests that would still run.
          #
          # shard_infrahub is test_infrahub_backup_restore.py +
          # test_infrahub_services.py (module files, not a directory): all three
          # of their tests carry @pytest.mark.api_only, so the ui cell collects
          # nothing. Drop this line if a dual-entrypoint Infrahub test is added.
          - {entrypoint: ui, shard: infrahub}
          # shard_apply's manifest-apply tests are all api_only.
          - {entrypoint: ui, shard: apply}
          # backend/tests/e2e/configuration/ is a real directory and is entirely
          # ui_only — the config drawer flows have no SDK equivalent — so the api
          # cell collects nothing.
          - {entrypoint: api, shard: configuration}
          #
          # shard_backup and shard_env_backup are deliberately NOT excluded from
          # either entrypoint. Their lifecycle tests drive create_backup /
          # create_restore / delete_backup / set_environment_backup_ttl /
          # create_environment_backup / clone_environment through the dual-entrypoint
          # scenario_driver, and per dev/knowledge/backend/e2e-testing.md
          # ("api_only audit discipline") the parametrisation over those methods
          # *is* the UI/API parity check, so they must run under both. Only
          # test_restore_failure_marks_failed_not_indefinite is api_only (it
          # discards the driver and submits an unknown backup id, which the UI
          # cannot express), which is not enough to empty the ui cell.
    steps:
      - uses: actions/checkout@v6
      - name: Show runner resources
        run: nproc && free -h && df -h /
      - uses: loft-sh/setup-vcluster@68e17a8c3618e3c47d635842b803d4f560f694e8
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Install Playwright browser + system deps
        if: matrix.entrypoint == 'ui'
        run: |
          uv run playwright install chromium
          uv run playwright install-deps chromium
      - name: Build no-netlink shim
        if: matrix.entrypoint == 'ui'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc
          gcc -shared -fPIC -Wall -Wextra \
            -o "$RUNNER_TEMP/no_netlink.so" \
            backend/tests/e2e/fixtures/no_netlink.c -ldl
          echo "NO_NETLINK_SO=$RUNNER_TEMP/no_netlink.so" >> "$GITHUB_ENV"
      - name: Install tini
        run: sudo apt-get update && sudo apt-get install -y tini
      # vCluster's docker driver shares host-built images (chart-server,
      # styrmin) with the cluster through the docker daemon registry proxy,
      # which needs the containerd image store. Hosted runners use the classic
      # store by default.
      - name: Use the containerd image store in Docker
        run: |
          sudo modprobe -a overlay bridge br_netfilter
          cfg=/etc/docker/daemon.json
          [ -f "$cfg" ] || echo '{}' | sudo tee "$cfg" >/dev/null
          sudo jq '.features["containerd-snapshotter"] = true' "$cfg" | sudo tee "$cfg.new" >/dev/null
          sudo mv "$cfg.new" "$cfg"
          cat "$cfg"
          sudo systemctl restart docker
          docker info -f '{{ .DriverStatus }}'
          docker version -f '{{ .Server.Version }}'
          docker compose version
      - name: "Set environment variables"
        run: |
          echo "STYRMIN_IMAGE_VER=local-${{ github.sha }}-${{ matrix.shard }}-${{ matrix.entrypoint }}" >> $GITHUB_ENV
      - name: Enable E2E tracing
        if: inputs.enable-e2e-tracing == true
        run: |
          echo "OTEL_SERVICE_NAME=styrmin-e2e-${{ matrix.entrypoint }}-${{ matrix.shard }}" >> $GITHUB_ENV
          echo "OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.TRACING_ENDPOINT }}" >> $GITHUB_ENV
          echo "OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}" >> $GITHUB_ENV
          echo "OTEL_EXPORTER_OTLP_PROTOCOL=grpc" >> $GITHUB_ENV
          echo "OTEL_RESOURCE_ATTRIBUTES=github.run_id=${GITHUB_RUN_ID}" >> $GITHUB_ENV
          echo "PYTEST_OTEL_ARGS=--export-traces" >> $GITHUB_ENV
      - name: Run E2E tests
        run: |
          exec tini -s -g -- uv run pytest -v \
            -m "ci and shard_${{ matrix.shard }}" \
            -k "${{ matrix.entrypoint }}-chromium" \
            --e2e-keep-cluster \
            ${PYTEST_OTEL_ARGS:-} \
            backend/tests/e2e
      - name: Show test cluster state
        if: failure()
        run: |
          docker ps -a
          for kc in /tmp/pytest-of-*/pytest-*/vcluster*/kubeconfig; do
            [ -f "$kc" ] || continue
            echo "=== $kc"
            kubectl --kubeconfig "$kc" get nodes -o wide || true
            kubectl --kubeconfig "$kc" get pods -A -o wide || true
            kubectl --kubeconfig "$kc" get events -A --sort-by=.lastTimestamp | tail -100 || true
            kubectl --kubeconfig "$kc" describe pods -A \
              --field-selector=status.phase!=Running,status.phase!=Succeeded || true
            kubectl --kubeconfig "$kc" describe pods -n default -l app=chart-server || true
          done
      - name: Upload Playwright diagnostic artifacts
        if: failure() && matrix.entrypoint == 'ui'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload agent logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-agent-logs-${{ matrix.entrypoint }}-${{ matrix.shard }}
          path: e2e-logs/
          if-no-files-found: ignore
          retention-days: 7
