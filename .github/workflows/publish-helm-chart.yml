---
# yamllint disable rule:truthy rule:line-length
name: Publish Helm Chart

on:
  workflow_dispatch:
    inputs:
      chart:
        type: string
        description: Which chart directory to publish (e.g. styrmin, agent)
        required: true
      publish:
        type: boolean
        description: Whether to publish the Chart to the OCI Registry
        required: false
        default: false
      branch:
        type: string
        description: Branch or tag to checkout
        required: false
        default: develop
  workflow_call:
    inputs:
      chart:
        type: string
        description: Which chart directory to publish (e.g. styrmin, agent)
        required: true
      publish:
        type: boolean
        description: Whether to publish the Chart to the OCI Registry
        required: false
        default: false
      branch:
        type: string
        description: Branch or tag to checkout
        required: false
        default: develop

jobs:
  publish-helm-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install yq
        uses: mikefarah/yq@065b200af9851db0d5132f50bc10b1406ea5c0a8  # v4.50.1

      - name: Login to Helm Registry
        run: >
          helm registry login ${{ vars.HARBOR_HOST }}
          --username '${{ secrets.HARBOR_USERNAME }}'
          --password '${{ secrets.HARBOR_PASSWORD }}'

      - name: Rewrite local dependency to OCI registry
        if: ${{ inputs.chart == 'styrmin' }}
        run: |
          CHART_DIR="./helm/${{ inputs.chart }}"
          AGENT_VERSION=$(yq '.version' ./helm/agent/Chart.yaml)
          echo "Rewriting styrmin-agent dependency from file:// to OCI registry (version: $AGENT_VERSION)"
          yq -i '(.dependencies[] | select(.name == "styrmin-agent")).repository = "oci://${{ vars.HARBOR_HOST }}/opsmill/chart"' "$CHART_DIR/Chart.yaml"
          yq -i '(.dependencies[] | select(.name == "styrmin-agent")).version = "'"$AGENT_VERSION"'"' "$CHART_DIR/Chart.yaml"
          echo "Updated Chart.yaml:"
          cat "$CHART_DIR/Chart.yaml"

      - name: Update Helm dependencies
        run: |
          helm dependency update ./helm/${{ inputs.chart }}

      - name: Get Chart Version
        id: chart-version
        run: |
          VERSION=$(yq '.version' ./helm/${{ inputs.chart }}/Chart.yaml)
          CHART_NAME=$(yq '.name' ./helm/${{ inputs.chart }}/Chart.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "chart_name=$CHART_NAME" >> $GITHUB_OUTPUT

      - name: Package Helm Chart
        run: |
          helm package ./helm/${{ inputs.chart }}

      - name: Push Helm Chart to OCI Registry
        if: ${{ inputs.publish }}
        run: |
          helm push ${{ steps.chart-version.outputs.chart_name }}-${{ steps.chart-version.outputs.version }}.tgz oci://${{ vars.HARBOR_HOST }}/opsmill/chart
