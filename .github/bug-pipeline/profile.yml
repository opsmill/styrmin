# AUTOGENERATED by .github/bug-pipeline/compose.py — do not hand-edit
# the structure. You MUST set profile.base_branch and
# profile.authoritative_checks to match this repo's real CI.
# Source-of-truth fragments live in opsmill/opsmill-cicd-workflows under
# `.github/bug-pipeline/{base,overlay-*}.yml`.
version: 1
profile:
  base_branch: develop
  test_layout:
    backend: pytest suites (backend/tests/unit, backend/tests/component, ...); mirror
      backend/styrmin_backend/foo.py -> backend/tests/unit/test_foo.py
    frontend: vitest unit/component tests colocated with source as *.test.ts under frontend/
  setup:
    - uv sync
    - cd frontend && pnpm install --frozen-lockfile
  runners:
    - suite: backend-unit
      framework: pytest
      command_hint: uv run pytest <path>::<TestClass>::<test_name> -x -v
    - suite: frontend-unit
      framework: vitest
      command_hint: cd frontend && pnpm run test <path>
  format:
    - uv run invoke format
    - cd frontend && pnpm run format
  lint:
    - uv run invoke lint
    - cd frontend && pnpm run lint
  authoritative_checks:
    - Unit Tests
  docs_pointers:
    - AGENTS.md
