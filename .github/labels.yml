---
# Declarative GitHub label configuration.
#
# Applied by .github/workflows/labels.yml using
# https://github.com/crazy-max/ghaction-github-labeler.
#
# `skip-delete: true` is set on the workflow, so labels created manually in
# the GitHub UI are preserved. Labels listed here are created or updated to
# match (name, description, color).

# ----------------------------------
# area
# ----------------------------------
- name: "area: driver"
  description: "Relates to an application driver (new driver request or driver bug)"
  color: "0e8a16"

- name: "area: backend"
  description: "Relates to the Python backend (GraphQL, core logic)"
  color: "b60205"

- name: "area: frontend"
  description: "Relates to the React frontend"
  color: "353755"

# ----------------------------------
# type
# ----------------------------------
- name: "type: bug"
  description: "Something isn't working"
  color: "d73a4a"

- name: "type: enhancement"
  description: "New feature or request"
  color: "a2eeef"

- name: "type: documentation"
  description: "Improvements or additions to documentation"
  color: "0075ca"

- name: "type: question"
  description: "Further information is requested"
  color: "d876e3"

- name: "type: housekeeping"
  description: ""
  color: "fef2c0"

- name: "type: tech-debt"
  description: ""
  color: "BA6D00"

- name: "type: duplicate"
  description: "This issue or pull request already exists"
  color: "cfd3d7"

# ----------------------------------
# status
# ----------------------------------
- name: "status: invalid"
  description: "This doesn't seem right"
  color: "e4e669"

- name: "status: wontfix"
  description: "This will not be worked on"
  color: "ffffff"

# ----------------------------------
# misc (GitHub defaults + automation)
# ----------------------------------
- name: "good first issue"
  description: "Good for newcomers"
  color: "7057ff"

- name: "help wanted"
  description: "Extra attention is needed"
  color: "008672"

# ----------------------------------
# bug-fixing pipeline (shared catalog)
# ----------------------------------
- name: "state/ai-pipeline-ready"
  description: "Approval gate: this issue/PR may be handled by the bug-fixing pipeline"
  color: "0e8a16"

- name: "state/need-more-info"
  description: "Bug pipeline: analyst needs more information to proceed"
  color: "fbca04"

- name: "state/needs-human-test"
  description: "Bug pipeline: the test stage could not proceed and needs a human"
  color: "d93f0b"

- name: "state/needs-human-fix"
  description: "Bug pipeline: the fix stage could not proceed and needs a human"
  color: "d93f0b"
