---
replicaCount: 1

image:
  repository: styrmin
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "styrmin-service-account"

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  runAsUser: 1000
  runAsNonRoot: true
  capabilities:
    drop:
    - "ALL"

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

terminationGracePeriodSeconds: 60

nodeSelector: {}

tolerations: []

affinity: {}

agent:
  enabled: true
  workPool: user-work-pool
  prefectApiUrl: http://prefect-server:4200/api
  styrminApiUrl: http://styrmin-server:8000
  extraEnv: []
