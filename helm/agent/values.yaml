---
replicaCount: 1

image:
  # Image registry (overridden by `global.imageRegistry` when set in the
  # parent chart). Set to `""` to consume a locally-built `styrmin:<tag>`
  # from the cluster's image store.
  registry: registry.opsmill.io/opsmill
  repository: styrmin
  # Image tag (defaults to appVersion if not set). The release workflow
  # keeps this chart's appVersion in lockstep with the `styrmin` chart,
  # so an untouched install pulls the image built for that release.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "styrmin-service-account"

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  runAsUser: 1000
  runAsNonRoot: true
  capabilities:
    drop:
    - "ALL"

# Requests only -- this chart never ships resource *limits*. A CPU limit
# throttles the agent instead of letting it burst, and a memory limit turns a
# transient spike into an OOM kill. See `dev/guidelines/helm.md`
# ("Never configure resource limits").
resources:
  requests:
    cpu: 100m
    memory: 512Mi

terminationGracePeriodSeconds: 60

# Applies the chart's CRDs (FluxCD, kopf, StyrminDeployment) in a pre-install and pre-upgrade
# hook Job, because Helm never updates the files in `crds/`. Disable it only when you apply
# these CRDs yourself before each upgrade.
crdUpgrade:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

agent:
  enabled: true
  workPool: user-work-pool
  prefectApiUrl: http://prefect-server:4200/api
  styrminApiUrl: http://styrmin-server:8000
  extraEnv: []
