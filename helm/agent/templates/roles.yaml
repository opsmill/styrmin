---
# permissions to do leader election.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- include "opsmill-operator.labels" . | nindent 4 }}
  name: {{ include "opsmill-operator.fullname" . }}-leader-election-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "opsmill-operator.labels" . | nindent 4 }}
  name: {{ include "opsmill-operator.fullname" . }}-leader-election-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "opsmill-operator.fullname" . }}-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ include "opsmill-operator.serviceAccountName" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "opsmill-operator.labels" . | nindent 4 }}
  name: {{ include "opsmill-operator.fullname" . }}-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "opsmill-operator.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "opsmill-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "opsmill-operator.fullname" . }}-manager-role
  labels:
    {{- include "opsmill-operator.labels" . | nindent 4 }}
rules:
##
## Base operator rules
##
# We need to get namespaces so the operator can read namespaces to ensure they exist
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - create
  - delete
  - list
# We need to manage Helm release secrets
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - "*"
# We need to create events on CRs about things happening during reconciliation
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
# We need to watch Prefect worker pods
- apiGroups:
  - ""
  resources:
  - pods
  - pods/log
  - pods/status
  verbs:
  - get
  - list
  - watch
# Kopf operator peering for leader election
- apiGroups:
  - kopf.dev
  resources:
  - clusterkopfpeerings
  verbs:
  - get
  - list
  - watch
  - patch
  - create
# StyrminDeployment CRD management
- apiGroups:
  - styrmin.io
  resources:
  - styrmindeployments
  - styrmindeployments/status
  verbs:
  - "*"

## Rules for Cloud related resources
- apiGroups:
  - traefik.io
  resources:
  - middlewares
  - ingressroutes
  verbs:
  - "*"
- apiGroups:
  - tailscale.com
  resources:
  - proxyclasses
  verbs:
  - "*"
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions # Required to install traefik CRDs
  verbs:
  - "*"
- apiGroups:
  - "networking.k8s.io"
  resources:
  - "ingressclasses" # Required to install traefik ingressclass
  verbs:
  - "*"
- apiGroups:
  - "velero.io"
  resources:
  - "backups"
  - "restores"
  - "backupstoragelocations"
  verbs:
  - "*"
- apiGroups:
  - "batch"
  verbs:
  - "*"
  resources:
  - "jobs"
  - "jobs/status"
##
## Rules for helm-controller
##
- apiGroups:
  - helm.toolkit.fluxcd.io
  resources:
  - "*"
  verbs:
  - "*"
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - "*"
  verbs:
  - "*"
- verbs:
  - "*"
  apiGroups:
  - "networking.k8s.io"
  resources:
  - "ingresses"
  - "networkpolicies"
- verbs:
  - "*"
  apiGroups:
  - ""
  resources:
  - "configmaps"
  - "persistentvolumeclaims"
  - "secrets"
  - "serviceaccounts"
  - "services"
- verbs:
  - "*"
  apiGroups:
  - "rbac.authorization.k8s.io"
  resources:
  - "clusterrolebindings"
  - "clusterroles"
  - "rolebindings"
  - "roles"
- verbs:
  - "*"
  apiGroups:
  - "apps"
  resources:
  - "deployments"
  - "statefulsets"
  - "replicasets"
- apiGroups:
    - policy
  resources:
    - poddisruptionbudgets
    - poddisruptionbudgets/finalizers
  verbs:
    - '*'
- verbs:
  - "*"
  apiGroups:
  - "batch"
  resources:
  - "cronjobs"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "opsmill-operator.labels" . | nindent 4 }}
  name: {{ include "opsmill-operator.fullname" . }}-prefect-worker-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "opsmill-operator.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: prefect-worker
  namespace: {{ .Release.Namespace }}
