apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: styrmindeployments.styrmin.io
spec:
  group: styrmin.io
  scope: Namespaced
  names:
    kind: StyrminDeployment
    plural: styrmindeployments
    singular: styrmindeployment
    shortNames:
      - sd
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                deploymentId:
                  type: string
                  description: UUID linking to Styrmin database deployment
                instanceId:
                  type: string
                  nullable: true
                  description: UUID of the active ApplicationInstance this CRD represents
                releaseReference:
                  type: string
                  description: Kubernetes release reference
                appName:
                  type: string
                  description: Application name from the driver
                appVersion:
                  type: string
                  description: Application version being deployed
                internal:
                  type: boolean
                  default: false
                  description: Whether this is an internal deployment (e.g., ingress controller)
                deletionRequested:
                  type: boolean
                  default: false
                  description: |
                    Set to true by the Styrmin backend to request teardown of all owned
                    resources. The operator reconciles the flip and progresses the CR
                    through phase Deleting -> Deleted. Immutable once true (CEL rule).
                  x-kubernetes-validations:
                    - rule: "oldSelf == false || self == true"
                      message: "deletionRequested cannot be set back to false once true"
                context:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: Serialized GlobalContext
                helm:
                  type: object
                  properties:
                    chart:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    repository:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                labels:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                parameters:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              required:
                - deploymentId
                - releaseReference
                - appName
                - appVersion
                - context
                - helm
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - CreatingPrerequisites
                    - CreatingHelmRelease
                    - CreatingServices
                    - Ready
                    - Restoring
                    - Failed
                    - Deleting
                    - Deleted
                displayState:
                  type: string
                  description: User-facing deployment state, distinct from internal phase
                  enum:
                    - Deploying
                    - Running
                    - Restoring
                    - Error
                    - Deleting
                    - Deleted
                message:
                  type: string
                instanceId:
                  type: string
                  description: |
                    UUID of the ApplicationInstance whose spec the operator last handled.
                    Written by the create, update and resume handlers; the status reporter
                    sends it in place of spec.instanceId.
                rolloutStartedAt:
                  type: string
                  format: date-time
                  description: |
                    When the create or update handler started the current rollout. The readiness
                    timeout counts from it, or from metadata.creationTimestamp when it is missing.
                deletionHandledAt:
                  type: string
                  format: date-time
                  description: |
                    When the delete handler last ran. Each run writes a new value, so kopf processes
                    the CR again until the CR's timer has ended and the finalizer can be removed.
                conditions:
                  type: array
                  description: |
                    NetworkPoliciesReady, SecretsReady, HelmReleaseReady, HelmReleaseRemediated,
                    ServicesReady, MiddlewaresReady, Ready and Deleted. Each rollout resets
                    HelmReleaseReady to Unknown (reason Progressing) and removes
                    HelmReleaseRemediated. While FluxCD has not reported the current HelmRelease
                    generation Ready, HelmReleaseReady carries FluxCD's Ready status and transition
                    time, and the reason and message of the failed install or upgrade when there is
                    one. HelmReleaseRemediated copies FluxCD's Remediated=True condition of the
                    current generation: FluxCD rolled back or uninstalled a failed release.
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                managedResources:
                  type: object
                  properties:
                    networkPolicies:
                      type: integer
                    secrets:
                      type: integer
                    helmReleases:
                      type: integer
                    services:
                      type: integer
                    middlewares:
                      type: integer
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: State
          type: string
          jsonPath: .status.displayState
        - name: App
          type: string
          jsonPath: .spec.appName
        - name: Version
          type: string
          jsonPath: .spec.appVersion
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
