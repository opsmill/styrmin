{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "styrmin.secretName" . }}
  labels:
    {{- include "styrmin.labels" . | nindent 4 }}
  {{- with .Values.secrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  # Driver authentication token
  driver-token: {{ .Values.styrmin.driver.token | quote }}

  # Agent source token for private repository access
  agent-source-token: {{ .Values.styrmin.agentSource.token | quote }}

  # Database credentials for Styrmin
  db-username: {{ .Values.styrmin.database.username | default .Values.global.postgresql.auth.username | quote }}
  db-password: {{ .Values.styrmin.database.password | default .Values.global.postgresql.auth.password | quote }}

  # Database credentials for Prefect
  prefect-db-username: "prefect"
  prefect-db-password: {{ .Values.global.postgresql.auth.password | quote }}
{{- end }}
