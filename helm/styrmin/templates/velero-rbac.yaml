{{- if .Values.velero.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "styrmin.fullname" . }}-velero
  labels:
    {{- include "styrmin.labels" . | nindent 4 }}
rules:
  - apiGroups: ["velero.io"]
    resources: ["backups", "restores", "backupstoragelocations"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
  # Read-only: backup flows read PodVolumeBackups for component steps and Backup.sizeBytes.
  - apiGroups: ["velero.io"]
    resources: ["podvolumebackups"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "styrmin.fullname" . }}-velero
  labels:
    {{- include "styrmin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "styrmin.fullname" . }}-velero
subjects:
  - kind: ServiceAccount
    name: {{ include "styrmin.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
