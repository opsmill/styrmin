apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "styrmin.taskWorker.fullname" . }}
  labels:
    {{- include "styrmin.labels" . | nindent 4 }}
    app.kubernetes.io/component: task-worker
spec:
  replicas: {{ .Values.taskWorkerReplicaCount }}
  selector:
    matchLabels:
      {{- include "styrmin.taskWorker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "styrmin.labels" . | nindent 8 }}
        app.kubernetes.io/component: task-worker
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "styrmin.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Wait for styrmin-server to be ready
      initContainers:
        - name: wait-for-server
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q --spider http://{{ include "styrmin.server.fullname" . }}:{{ .Values.service.port }}/health; do
                echo "Waiting for styrmin-server to be ready..."
                sleep 5
              done
              echo "styrmin-server is ready!"
      containers:
        - name: styrmin-task-worker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "styrmin.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - prefect
            - worker
            - start
            - --pool
            - styrmin-work-pool
          envFrom:
            - configMapRef:
                name: {{ include "styrmin.configMapName" . }}
          env:
            # Database credentials (needed for some operations)
            - name: STYRMIN_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "styrmin.secretName" . }}
                  key: db-username
            - name: STYRMIN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "styrmin.secretName" . }}
                  key: db-password
            - name: STYRMIN_DB_URL
              value: {{ include "styrmin.postgresql.url" . | quote }}
            # Driver token
            - name: STYRMIN_DRIVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "styrmin.secretName" . }}
                  key: driver-token
            # Agent source token
            - name: STYRMIN_AGENT_SOURCE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "styrmin.secretName" . }}
                  key: agent-source-token
            {{- if .Values.taskWorkerQuerySeconds }}
            - name: PREFECT_WORKER_QUERY_SECONDS
              value: {{ .Values.taskWorkerQuerySeconds | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.taskWorkerResources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
