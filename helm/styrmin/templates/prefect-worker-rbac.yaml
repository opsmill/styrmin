{{- if index .Values "styrmin-agent" "enabled" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "styrmin.fullname" . }}-prefect-worker
  labels:
    {{- include "styrmin.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch"]
  # Operator: watch HelmReleases for deployment lifecycle
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch", "patch"]
  # Operator: manage NetworkPolicies
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Operator: reconcile Services and Secrets
  - apiGroups: [""]
    resources: ["services", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Operator: reconcile Traefik Middlewares
  - apiGroups: ["traefik.io"]
    resources: ["middlewares"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Operator: emit Kubernetes Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Operator: kopf peering for leader election
  - apiGroups: ["kopf.dev"]
    resources: ["clusterkopfpeerings"]
    verbs: ["get", "list", "watch", "patch", "create"]
  # Operator: manage StyrminDeployment CRDs
  - apiGroups: ["styrmin.io"]
    resources: ["styrmindeployments", "styrmindeployments/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "styrmin.fullname" . }}-prefect-worker
  labels:
    {{- include "styrmin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "styrmin.fullname" . }}-prefect-worker
subjects:
  - kind: ServiceAccount
    name: prefect-worker
    namespace: {{ .Release.Namespace }}
{{- end }}
