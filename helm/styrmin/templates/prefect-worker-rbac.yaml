{{- if index .Values "styrmin-agent" "enabled" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "styrmin.fullname" . }}-prefect-worker
  labels:
    {{- include "styrmin.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "styrmin.fullname" . }}-prefect-worker
  labels:
    {{- include "styrmin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "styrmin.fullname" . }}-prefect-worker
subjects:
  - kind: ServiceAccount
    name: prefect-worker
    namespace: {{ .Release.Namespace }}
{{- end }}
