# Default values for styrmin.
# This is a YAML-formatted file.

# -- Number of replicas for styrmin-server
replicaCount: 1

# -- Number of replicas for styrmin task-worker (Prefect worker)
taskWorkerReplicaCount: 1

# -- Query interval in seconds for the task worker (PREFECT_WORKER_QUERY_SECONDS)
taskWorkerQuerySeconds: ""

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the chart
fullnameOverride: ""

global:
  postgresql:
    auth:
      username: "styrmin"
      password: "styrmin-password"
      database: "styrmin"

# Styrmin server image configuration
image:
  # -- Image registry
  registry: ""
  # -- Image repository
  repository: styrmin
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag (defaults to appVersion if not set)
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []
# - name: my-registry-secret

# Service account configuration
serviceAccount:
  # -- Create a service account
  create: true
  # -- Automatically mount API credentials
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Service account name (generated if not set)
  name: "styrmin-service-account"

# -- Annotations to add to pods
podAnnotations: {}

# -- Labels to add to pods
podLabels: {}

# -- Pod security context
podSecurityContext: {}
  # fsGroup: 2000

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  runAsUser: 1000
  runAsNonRoot: true
  capabilities:
    drop:
      - "ALL"

# Styrmin server service configuration
service:
  # -- Service type
  type: ClusterIP
  # -- Service port
  port: 8000

# Styrmin server ingress configuration
ingress:
  # -- Enable ingress for styrmin-server
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Ingress hosts configuration
  hosts:
    - host: styrmin.local
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration
  tls: []
  # - secretName: styrmin-tls
  #   hosts:
  #     - styrmin.local

# Resource requests for styrmin-server
resources:
  requests:
    cpu: 100m
    memory: 256Mi

# Resource requests for task-worker
taskWorkerResources:
  requests:
    cpu: 50m
    memory: 128Mi

# Liveness probe for styrmin-server
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe for styrmin-server
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -- Node selector for pods
nodeSelector: {}

# -- Tolerations for pods
tolerations: []

# -- Affinity rules for pods
affinity: {}

# Autoscaling configuration for styrmin-server
autoscaling:
  # -- Enable horizontal pod autoscaler
  enabled: false
  # -- Minimum replicas
  minReplicas: 1
  # -- Maximum replicas
  maxReplicas: 10
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80
  # -- Target memory utilization percentage
  # targetMemoryUtilizationPercentage: 80

# =============================================================================
# Styrmin Configuration
# =============================================================================

styrmin:
  # -- Log level (DEBUG, INFO, WARNING, ERROR)
  logLevel: INFO

  # -- Bootstrap admin username seeded on first boot (see ADR-019).
  # The bootstrap is a no-op when a user with this username already exists.
  adminUsername: "admin"

  # -- Bootstrap admin password (see ADR-019). Optional. When unset the
  # backend generates a random password at first boot and logs it once at
  # WARN level — capture it from the boot logs. Set this for IaC / CI
  # environments that want a known credential baked into the install.
  adminPassword: ""

  # -- Whether to set the Secure attribute on the session cookie. Production
  # must serve over HTTPS and leave this as ``true``. Set to ``false`` only
  # for local HTTP demos — browsers drop ``Secure`` cookies on non-HTTPS,
  # non-localhost origins, so logging in over plain http://... would silently
  # fail.
  sessionCookieSecure: true

  # URL configuration
  url:
    # -- API URL for Kubernetes jobs (must be resolvable from K8s pods)
    # Will be auto-generated if not set using full DNS name
    apiK8s: ""

  # Kubernetes defaults
  kubernetes:
    # -- Default resource prefix for created resources
    defaultResourcePrefix: "styrmin"
    # -- Kubernetes cluster DNS domain (e.g. "cluster.local")
    clusterDomain: "cluster.local"

  # Agent source configuration (for Git-based deployments)
  agentSource:
    # -- Git repository URL
    repository: "https://github.com/opsmill/styrmin.git"
    # -- Git branch to use
    branch: "develop"
    # -- Token for private repository access (use existingSecret for production)
    token: ""

  # Driver configuration
  driver:
    # -- Token for driver authentication (use existingSecret for production)
    token: ""

  # Database configuration for Styrmin
  database:
    # -- Database type (sqlite or postgres)
    type: postgres
    # -- Database name
    name: styrmin
    # -- Database host
    host: ""
    # -- Database port
    port: 5432
    # -- Database username (use existingSecret for production)
    username: ""
    # -- Database password (use existingSecret for production)
    password: ""

  # Agent poll configuration (for Prefect task retries)
  agentPoll:
    # -- Number of retries for polling tasks
    retries: 60
    # -- Delay between retries in seconds
    retryDelaySeconds: 10
    # -- Interval for polling deployment status in seconds
    interval: 10

  # Workflow/Prefect configuration
  workflow:
    # -- Enable Prefect workflow integration
    enable: true
    # -- Prefect server address (auto-configured when using prefect subchart)
    address: ""
    # -- Prefect server port
    port: 4200
    # -- Enable TLS for Prefect connection
    tlsEnabled: false

# Secrets configuration
secrets:
  # -- Use existing secret instead of creating one
  # The secret should contain: driver-token, agent-source-token, db-password
  existingSecret: ""
  # -- Annotations for the created secret
  annotations: {}

postgresql:
  enabled: true

  image:
    repository: bitnamilegacy/postgresql

  primary:
    # -- Init scripts to create additional databases
    initdb:
      scripts:
        init-databases.sql: |
          -- Create prefect database and user
          CREATE DATABASE prefect OWNER styrmin;

    # -- Resource configuration for PostgreSQL primary
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits: {}

    persistence:
      # -- Enable persistence
      enabled: true
      # -- Storage class (leave empty for default)
      storageClass: ""
      # -- PVC size
      size: 10Gi

# =============================================================================
# Prefect Server Subchart Configuration
# =============================================================================
# Prefect server subchart values
prefect-server:
  enabled: true

  postgresql:
    enabled: false

  secret:
    username: "styrmin"
    password: "styrmin-password"
    database: "prefect"
    host: styrmin-postgresql
    port: 5432

  # Service configuration
  service:
    type: ClusterIP
    port: 4200

  server:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi


# =============================================================================
# Styrmin Agent Configuration
# =============================================================================
# =============================================================================
# Velero Backup Configuration
# =============================================================================
velero:
  enabled: true
  kubectl:
    image:
      repository: bitnamilegacy/kubectl
      tag: 1.33
  initContainers:
    - name: velero-plugin-for-aws
      image: "velero/velero-plugin-for-aws:v1.11.1"
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - name: plugins
          mountPath: /target
  backupsEnabled: false
  configuration: {}
  deployNodeAgent: true
  snapshotsEnabled: false
  credentials:
    useSecret: false
  configMaps:
    velero-restore-pvc-patch: # This resourceModifier is required to properly restore PVCs
      labels: {}
      data:
        resource-patch.yaml: |
          version: v1
          resourceModifierRules:
          - conditions:
              groupResource: persistentvolumeclaims
            patches:
            - operation: remove
              path: "/spec/volumeName"
    fs-restore-action-config: # This is required for FSB restores to not fail on Permission denied
      labels:
        velero.io/plugin-config: ""
        velero.io/pod-volume-restore: RestoreItemAction
      data:
        secCtx: |
          capabilities:
            drop: []
            add: []
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
  nodeAgent:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

styrmin-agent:
  enabled: true

  serviceAccount:
    create: false # We already create the service account in this chart

  agent:
    workPool: user-work-pool
    prefectApiUrl: http://prefect-server:4200/api
    styrminApiUrl: http://styrmin-server:8000
